<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON SERPENT - 霓虹蛇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #050510;
            touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: auto; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ==================== 配置 ====================
const WORLD=50, BASE_SPEED=11, MAX_SPEED=22, SPEED_INC=0.3;
const MAX_HISTORY=400, REWIND_DRAIN=1.0, ENERGY_MAX=100, ENERGY_REGEN=0.10;
const COMBO_TIMEOUT=2200, PARTICLE_LIMIT=300;
const FOOD_TARGET=12, FOOD_MIN=7, AI_COUNT=3, AI_RESPAWN_TIME=12;
const AI_DEATH_FOOD_RATE=0.4, VIEW_CELLS=26;

const C = {
    bg:'#0a0a1a', headCore:'#ffffff', headGlow:'#00ffff',
    bodyStart:'#00ffff', bodyEnd:'#6600cc',
    foodCore:'#ffff44', foodGlow:'#ffaa00',
    energyBar:'#ff00aa', energyBg:'#330033',
    scoreGlow:'#00ffff', comboGlow:'#ff00ff',
    rewindTint:'#ff6600', deathFlash:'#ff0044',
    aiColors:[
        {head:'#ff00ff',bodyEnd:'#880088',name:'VOID-A'},
        {head:'#00ff88',bodyEnd:'#006633',name:'VOID-B'},
        {head:'#ff8800',bodyEnd:'#884400',name:'VOID-C'},
    ],
    joyBase:'rgba(20,20,50,0.6)', joyBorder:'rgba(0,255,255,0.4)',
    joyThumb:'#00ffff', rewindBtn:'#ff00aa',
};

// ==================== 工具 ====================
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const rand=(a,b)=>Math.random()*(b-a)+a;
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const lerpColor=(c1,c2,t)=>{
    const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);
    const r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);
    return`rgb(${Math.round(lerp(r1,r2,t))},${Math.round(lerp(g1,g2,t))},${Math.round(lerp(b1,b2,t))})`;
};

// ==================== 预渲染发光贴图（性能核心） ====================
class GlowCache {
    constructor(){ this.cache=new Map(); }
    // 生成指定颜色的发光圆贴图，size为半径
    get(color,size){
        const key=`${color}_${size}`;
        if(this.cache.has(key))return this.cache.get(key);
        const s=Math.max(4,Math.ceil(size*2));
        const cv=document.createElement('canvas');
        cv.width=s; cv.height=s;
        const ctx=cv.getContext('2d');
        const cx=s/2,cy=s/2,r=s/2;
        const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
        // 解析颜色
        const rgb=this._parseColor(color);
        g.addColorStop(0,`rgba(${rgb},0.8)`);
        g.addColorStop(0.3,`rgba(${rgb},0.35)`);
        g.addColorStop(0.7,`rgba(${rgb},0.08)`);
        g.addColorStop(1,`rgba(${rgb},0)`);
        ctx.fillStyle=g;
        ctx.fillRect(0,0,s,s);
        this.cache.set(key,cv);
        return cv;
    }
    _parseColor(c){
        if(c.startsWith('#')){const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);return`${r},${g},${b}`;}
        if(c.startsWith('rgb')){const m=c.match(/\d+/g);return m?m.slice(0,3).join(','):'255,255,255';}
        return '255,255,255';
    }
    // 画一个带发光的圆（高性能版）
    drawGlow(ctx,x,y,radius,color,alpha=1){
        const glow=this.get(color,Math.ceil(radius*3));
        ctx.globalAlpha=alpha;
        ctx.drawImage(glow,x-glow.width/2,y-glow.height/2);
    }
    // 画一个实心圆+发光
    drawDot(ctx,x,y,radius,color,glowAlpha=0.2){
        // 发光层
        this.drawGlow(ctx,x,y,radius*2.5,color,glowAlpha);
        // 实心层
        ctx.globalAlpha=1;
        ctx.fillStyle=color;
        ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();
    }
}

// ==================== 音频 ====================
class Audio {
    constructor(){this.ctx=null;this.on=true;}
    init(){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){this.on=false;}}
    resume(){if(this.ctx?.state==='suspended')this.ctx.resume();}
    _tone(type,f1,f2,dur,vol=.1){
        if(!this.on||!this.ctx)return;const t=this.ctx.currentTime;
        const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur*.7);
        g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
        o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+dur);
    }
    eat(p=1){this._tone('sine',400*p,900*p,.1,.08);}
    combo(lv){this._tone('triangle',600*(1+lv*.15),1300*(1+lv*.15),.08,.06);}
    kill(){this._tone('square',200,80,.2,.06);}
    death(){if(!this.on||!this.ctx)return;const t=this.ctx.currentTime,n=this.ctx.sampleRate*.3,
        buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=buf.getChannelData(0);
        for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*.3;const s=this.ctx.createBufferSource();s.buffer=buf;
        const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(80,t+.25);
        const g=this.ctx.createGain();g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
        s.connect(f).connect(g).connect(this.ctx.destination);s.start(t);s.stop(t+.3);}
    startRewind(){if(!this.on||!this.ctx)return;this._rwO=this.ctx.createOscillator();this._rwG=this.ctx.createGain();
        const l=this.ctx.createOscillator(),lg=this.ctx.createGain();this._rwO.type='sawtooth';this._rwO.frequency.value=55;
        l.type='sine';l.frequency.value=3;lg.gain.value=12;l.connect(lg).connect(this._rwO.frequency);
        this._rwG.gain.value=0;this._rwG.gain.linearRampToValueAtTime(.05,this.ctx.currentTime+.1);
        this._rwO.connect(this._rwG).connect(this.ctx.destination);this._rwO.start();l.start();this._rwL=l;}
    stopRewind(){if(!this._rwO)return;try{this._rwG.gain.linearRampToValueAtTime(0,this.ctx.currentTime+.1);
        setTimeout(()=>{try{this._rwO.stop();this._rwL.stop();}catch(e){}},150);}catch(e){}this._rwO=null;}
}

// ==================== 粒子（无 shadowBlur） ====================
class Particle {
    constructor(x,y,vx,vy,color,size,life,type='normal'){
        this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;
        this.size=Math.max(.5,size);this.maxLife=life;this.life=life;this.type=type;}
    update(dt){this.life-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;
        if(this.type==='float'){this.vy-=15*dt;this.vx*=.98;}
        else if(this.type==='spark'){this.vx*=.94;this.vy*=.94;}}
    get a(){return clamp(this.life/this.maxLife,0,1);}
    get dead(){return this.life<=0;}
}
class Particles {
    constructor(){this.p=[];this.reduced=false;}
    add(p){if(this.p.length<(this.reduced?150:PARTICLE_LIMIT))this.p.push(p);}
    burst(x,y,color,n=14){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(40,150);
        this.add(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,color,rand(1.5,3.5),rand(.2,.6),'spark'));}}
    explosion(x,y,n=35){const cols=[C.headGlow,C.foodGlow,C.comboGlow,'#ff0044','#fff'];
        for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(25,200);
        this.add(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,cols[randInt(0,4)],rand(1.5,5),rand(.3,1),'spark'));}}
    trail(x,y,color){this.add(new Particle(x+rand(-2,2),y+rand(-2,2),rand(-8,8),rand(-8,8),color,rand(1,2.5),rand(.12,.3),'float'));}
    scorePopup(x,y,text,color){const p=new Particle(x,y,0,-50,color,0,.9,'scoreText');p.text=text;this.add(p);}
    update(dt){for(let i=this.p.length-1;i>=0;i--){this.p[i].update(dt);if(this.p[i].dead)this.p.splice(i,1);}}
    render(ctx,glow){
        for(const p of this.p){
            if(p.type==='scoreText'){
                ctx.save();ctx.globalAlpha=p.a;ctx.font='bold 14px monospace';
                ctx.fillStyle=p.color;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);
                ctx.restore();
            } else {
                const r=Math.max(.5,p.size*p.a);
                glow.drawGlow(ctx,p.x,p.y,r*3,p.color,p.a*.5);
                ctx.globalAlpha=p.a;ctx.fillStyle=p.color;
                ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
            }
        }
    }
}

// ==================== 主游戏 ====================
class Game {
    constructor(canvas){
        this.cv=canvas;this.ctx=canvas.getContext('2d');
        this.audio=new Audio();this.particles=new Particles();
        this.glow=new GlowCache();
        this.isTouch='ontouchstart' in window;
        // 检测低端设备
        this.lowEnd=this.isTouch&&window.devicePixelRatio<=1;
        if(this.lowEnd)this.particles.reduced=true;
        this.state='MENU';
        this.isRewinding=false;this.timeEnergy=ENERGY_MAX;
        this.score=0;this.highScore=parseInt(localStorage.getItem('neonSerpentHigh')||'0');
        this.combo=0;this.maxCombo=0;this.lastEatTime=0;
        this.foodEaten=0;this.kills=0;this.speed=BASE_SPEED;
        this.player=null;this.aiSnakes=[];this.aiRespawnTimers=[];
        this.foods=[];this.stateHistory=[];
        this.camX=25;this.camY=25;this.camTargetX=25;this.camTargetY=25;
        this.cellSize=0;this.shakeAmt=0;this.shakeX=0;this.shakeY=0;this.gridPulse=0;
        this.interpFactor=0;this.tickAcc=0;this.time=0;this.lastTime=0;this.deathTime=0;
        this.visualDir={x:1,y:0};
        this.joyActive=false;this.joyX=0;this.joyY=0;this.joyTouchId=null;
        this.rewindTouchId=null;this.inputQueue=[];
        this.menuSnake=[];this.menuDir={x:1,y:0};this.menuAcc=0;this.menuTurnT=0;
        this.resize();this.initInput();this.initMenuSnake();
    }

    resize(){
        const dpr=this.lowEnd?1:(window.devicePixelRatio||1);
        this.cv.width=window.innerWidth*dpr;this.cv.height=window.innerHeight*dpr;
        this.ctx.setTransform(dpr,0,0,dpr,0,0);
        this.W=window.innerWidth;this.H=window.innerHeight;
        this.hudH=50;this.joyAreaH=this.isTouch?160:0;
        this.gameTop=this.hudH;this.gameBot=this.H-this.joyAreaH;
        this.gameH=this.gameBot-this.gameTop;this.gameW=this.W;
        this.cellSize=Math.max(8,Math.floor(Math.min(this.gameW,this.gameH)/VIEW_CELLS));
        // 清除发光贴图缓存（尺寸变了）
        this.glow.cache.clear();
    }

    w2s(wx,wy){return{x:(wx-this.camX)*this.cellSize+this.gameW/2,y:(wy-this.camY)*this.cellSize+this.gameH/2+this.gameTop};}
    isVisible(wx,wy){const s=this.w2s(wx,wy),m=this.cellSize*2;return s.x>-m&&s.x<this.gameW+m&&s.y>this.gameTop-m&&s.y<this.gameBot+m;}

    makeSnake(sx,sy,len,dir,colorIdx=-1){
        const body=[];for(let i=0;i<len;i++)body.push({x:sx-dir.x*i,y:sy-dir.y*i});
        return{body,prevBody:body.map(p=>({...p})),dir:{...dir},nextDir:{...dir},
               alive:true,colorIdx,tickAcc:0,foodEaten:0,growPending:0};
    }

    spawnFood(){
        const occ=new Set();
        const add=(sn)=>sn.body.forEach(p=>occ.add(`${p.x},${p.y}`));
        if(this.player)add(this.player);
        this.aiSnakes.forEach(a=>{if(a.alive)add(a);});
        this.foods.forEach(f=>occ.add(`${f.x},${f.y}`));
        let t=0;while(t<200){const x=randInt(1,WORLD-2),y=randInt(1,WORLD-2);
            if(!occ.has(`${x},${y}`)){this.foods.push({x,y});return;}t++;}
    }
    ensureFood(){while(this.foods.length<FOOD_MIN)this.spawnFood();}

    startGame(){
        this.audio.init();this.audio.resume();this.state='PLAYING';
        this.score=0;this.combo=0;this.maxCombo=0;this.lastEatTime=0;
        this.foodEaten=0;this.kills=0;this.speed=BASE_SPEED;
        this.timeEnergy=ENERGY_MAX;this.isRewinding=false;
        this.stateHistory=[];this.tickAcc=0;this.interpFactor=0;
        this.particles.p=[];this.inputQueue=[];
        this.player=this.makeSnake(25,25,4,{x:1,y:0});
        this.visualDir={x:1,y:0};
        this.aiSnakes=[];this.aiRespawnTimers=[];
        const sp=[{x:8,y:8,d:{x:1,y:0}},{x:41,y:8,d:{x:-1,y:0}},{x:8,y:41,d:{x:0,y:-1}}];
        for(let i=0;i<AI_COUNT;i++){this.aiSnakes.push(this.makeSnake(sp[i].x,sp[i].y,5,sp[i].d,i));this.aiRespawnTimers.push(0);}
        this.foods=[];for(let i=0;i<FOOD_TARGET;i++)this.spawnFood();
        this.camX=25;this.camY=25;this.camTargetX=25;this.camTargetY=25;
    }

    saveState(){
        this.stateHistory.push({body:this.player.body.map(p=>({...p})),foods:this.foods.map(f=>({...f})),
            score:this.score,dir:{...this.player.dir},foodEaten:this.foodEaten,speed:this.speed,combo:this.combo});
        if(this.stateHistory.length>MAX_HISTORY)this.stateHistory.shift();
    }
    rewindTick(){
        if(!this.stateHistory.length){this.isRewinding=false;this.audio.stopRewind();return;}
        for(let i=0;i<2&&this.stateHistory.length;i++){
            const s=this.stateHistory.pop();
            this.player.body=s.body;this.player.prevBody=s.body.map(p=>({...p}));
            this.foods=s.foods;this.score=s.score;this.player.dir=s.dir;
            this.player.nextDir={...s.dir};this.visualDir={...s.dir};
            this.foodEaten=s.foodEaten;this.speed=s.speed;this.combo=s.combo;
        }
        this.timeEnergy-=REWIND_DRAIN;
        if(this.timeEnergy<=0){this.timeEnergy=0;this.isRewinding=false;this.audio.stopRewind();}
    }

    isWall(x,y){return x<0||x>=WORLD||y<0||y>=WORLD;}
    allSnakes(){return[this.player,...this.aiSnakes.filter(a=>a.alive)];}

    queueDir(d){if(this.inputQueue.length<3)this.inputQueue.push(d);}
    processInput(){
        while(this.inputQueue.length){const d=this.inputQueue.shift();
            if(d.x!==-this.player.dir.x||d.y!==-this.player.dir.y){
                if(d.x!==this.player.dir.x||d.y!==this.player.dir.y){this.player.nextDir={...d};break;}}}
    }

    initInput(){
        const self=this;
        window.addEventListener('keydown',e=>{
            self.audio.resume();
            if(self.state==='MENU'||self.state==='GAMEOVER'){if(e.code==='Space'||e.code==='Enter'){self.startGame();e.preventDefault();}return;}
            if(self.state==='PLAYING'){
                if(e.code==='Space'){if(!self.isRewinding&&self.timeEnergy>5){self.isRewinding=true;self.audio.startRewind();}e.preventDefault();return;}
                const dm={'ArrowUp':{x:0,y:-1},'KeyW':{x:0,y:-1},'ArrowDown':{x:0,y:1},'KeyS':{x:0,y:1},
                    'ArrowLeft':{x:-1,y:0},'KeyA':{x:-1,y:0},'ArrowRight':{x:1,y:0},'KeyD':{x:1,y:0}};
                if(dm[e.code]){
                    const d=dm[e.code];
                    if(d.x!==-self.player.dir.x||d.y!==-self.player.dir.y){
                        if(d.x!==self.visualDir.x||d.y!==self.visualDir.y)self.visualDir={...d};}
                    self.queueDir(d);e.preventDefault();}
            }
        });
        window.addEventListener('keyup',e=>{if(e.code==='Space'&&self.isRewinding){self.isRewinding=false;self.audio.stopRewind();}});
        if(this.isTouch)this.initTouch();
        window.addEventListener('resize',()=>self.resize());
    }

    initTouch(){
        const self=this;
        this.getJP=()=>{const cx=this.W/2,cy=this.gameBot+this.joyAreaH/2,r=Math.min(this.W*.17,this.joyAreaH*.33);return{cx,cy,r,tr:r*.4};};
        this.getRP=()=>{const r=Math.min(this.W*.07,this.joyAreaH*.18);return{cx:this.W-r-18,cy:this.gameBot+this.joyAreaH/2,r};};
        this.cv.addEventListener('touchstart',e=>{e.preventDefault();self.audio.resume();
            for(const t of e.changedTouches){
                if(self.state==='MENU'||self.state==='GAMEOVER'){self.startGame();return;}
                if(self.state!=='PLAYING')continue;
                const jp=self.getJP();
                if(dist(t.clientX,t.clientY,jp.cx,jp.cy)<jp.r*1.8){self.joyActive=true;self.joyTouchId=t.identifier;self.updJoy(t.clientX,t.clientY,jp);continue;}
                const rp=self.getRP();
                if(dist(t.clientX,t.clientY,rp.cx,rp.cy)<rp.r*1.5){self.rewindTouchId=t.identifier;
                    if(!self.isRewinding&&self.timeEnergy>5){self.isRewinding=true;self.audio.startRewind();}continue;}
            }
        },{passive:false});
        this.cv.addEventListener('touchmove',e=>{e.preventDefault();if(self.state!=='PLAYING')return;
            for(const t of e.changedTouches){if(t.identifier===self.joyTouchId)self.updJoy(t.clientX,t.clientY,self.getJP());}
        },{passive:false});
        const end=e=>{e.preventDefault();for(const t of e.changedTouches){
            if(t.identifier===self.joyTouchId){self.joyActive=false;self.joyTouchId=null;}
            if(t.identifier===self.rewindTouchId){self.rewindTouchId=null;if(self.isRewinding){self.isRewinding=false;self.audio.stopRewind();}}
        }};
        this.cv.addEventListener('touchend',end,{passive:false});
        this.cv.addEventListener('touchcancel',end,{passive:false});
    }

    updJoy(tx,ty,jp){
        let dx=tx-jp.cx,dy=ty-jp.cy;const d=Math.hypot(dx,dy),mx=jp.r*.8;
        if(d>mx){dx=dx/d*mx;dy=dy/d*mx;}
        this.joyX=dx;this.joyY=dy;
        const th=jp.r*.25;if(d>th){
            let nd=Math.abs(dx)>Math.abs(dy)?(dx>0?{x:1,y:0}:{x:-1,y:0}):(dy>0?{x:0,y:1}:{x:0,y:-1});
            if(nd.x!==-this.player.dir.x||nd.y!==-this.player.dir.y)this.visualDir={...nd};
            this.queueDir(nd);
        }
    }

    // ---- 玩家 tick ----
    playerTick(){
        const p=this.player;this.processInput();
        p.dir={...p.nextDir};this.visualDir={...p.dir};
        this.saveState();p.prevBody=p.body.map(s=>({...s}));
        const head=p.body[0],nh={x:head.x+p.dir.x,y:head.y+p.dir.y};
        if(this.isWall(nh.x,nh.y)){this.gameOver();return;}
        for(let i=0;i<p.body.length-1;i++){if(p.body[i].x===nh.x&&p.body[i].y===nh.y){this.gameOver();return;}}
        for(const ai of this.aiSnakes){if(!ai.alive)continue;for(const seg of ai.body){if(seg.x===nh.x&&seg.y===nh.y){this.gameOver();return;}}}
        p.body.unshift(nh);
        const fi=this.foods.findIndex(f=>f.x===nh.x&&f.y===nh.y);
        if(fi>=0){this.foods.splice(fi,1);this.eatFood(nh);}
        else{if(p.growPending>0)p.growPending--;else p.body.pop();}
    }

    eatFood(pos){
        const now=Date.now();
        if(now-this.lastEatTime<COMBO_TIMEOUT)this.combo=Math.min(this.combo+1,5);else this.combo=0;
        this.lastEatTime=now;if(this.combo>this.maxCombo)this.maxCombo=this.combo;
        const pts=10*(this.combo+1);this.score+=pts;this.foodEaten++;
        const s=this.w2s(pos.x,pos.y);
        this.particles.burst(s.x,s.y,C.foodCore,12);
        this.particles.scorePopup(s.x,s.y-8,`+${pts}`,this.combo>0?C.comboGlow:C.foodGlow);
        this.audio.eat(1+this.combo*.1);if(this.combo>0)this.audio.combo(this.combo);
        this.shakeAmt=Math.min(2+this.combo,5);this.gridPulse=.3;this.player.growPending++;
        if(this.foodEaten%5===0)this.speed=Math.min(MAX_SPEED,this.speed+SPEED_INC);
        this.ensureFood();
    }

    // ---- AI ----
    aiTick(ai,idx){
        if(!ai.alive)return;
        ai.prevBody=ai.body.map(p=>({...p}));
        const head=ai.body[0],nearF=this.nearestFood(head);if(!nearF)return;
        const dirs=[{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
        dirs.sort((a,b)=>(Math.abs(head.x+a.x-nearF.x)+Math.abs(head.y+a.y-nearF.y))-(Math.abs(head.x+b.x-nearF.x)+Math.abs(head.y+b.y-nearF.y)));
        // 只建一次碰撞集合
        const bodies=new Set();
        for(const sn of this.allSnakes())sn.body.forEach((p,si)=>{if(sn===ai&&si===sn.body.length-1)return;bodies.add(`${p.x},${p.y}`);});
        let chosen=null;
        if(Math.random()<.1){const safe=dirs.filter(d=>{const nx=head.x+d.x,ny=head.y+d.y;return!this.isWall(nx,ny)&&!bodies.has(`${nx},${ny}`)&&!(d.x===-ai.dir.x&&d.y===-ai.dir.y);});if(safe.length)chosen=safe[randInt(0,safe.length-1)];}
        if(!chosen){for(const d of dirs){if(this.isWall(head.x+d.x,head.y+d.y)||bodies.has(`${head.x+d.x},${head.y+d.y}`)||(d.x===-ai.dir.x&&d.y===-ai.dir.y))continue;chosen=d;break;}}
        if(!chosen){for(const d of dirs){if(!this.isWall(head.x+d.x,head.y+d.y)&&!bodies.has(`${head.x+d.x},${head.y+d.y}`)){chosen=d;break;}}}
        if(!chosen)return;
        ai.dir=chosen;const nh={x:head.x+ai.dir.x,y:head.y+ai.dir.y};
        if(this.isWall(nh.x,nh.y)){this.aiDeath(ai,idx);return;}
        // 复用同一个 bodies 集合做碰撞检测
        if(bodies.has(`${nh.x},${nh.y}`)){this.aiDeath(ai,idx);return;}
        ai.body.unshift(nh);
        const fi=this.foods.findIndex(f=>f.x===nh.x&&f.y===nh.y);
        if(fi>=0){this.foods.splice(fi,1);ai.foodEaten++;if(ai.foodEaten%3===0)ai.growPending++;}
        else{if(ai.growPending>0)ai.growPending--;else ai.body.pop();}
        if(fi<0&&ai.growPending===0&&ai.body.length>25)ai.body.pop();
    }

    nearestFood(pos){let b=null,bd=Infinity;for(const f of this.foods){const d=Math.abs(f.x-pos.x)+Math.abs(f.y-pos.y);if(d<bd){bd=d;b=f;}}return b;}

    aiDeath(ai,idx){
        ai.alive=false;const s=this.w2s(ai.body[0].x,ai.body[0].y);
        this.particles.explosion(s.x,s.y,30);
        for(const seg of ai.body){if(Math.random()<AI_DEATH_FOOD_RATE){if(!this.foods.some(f=>f.x===seg.x&&f.y===seg.y))this.foods.push({x:seg.x,y:seg.y});}}
        this.audio.kill();this.kills++;this.score+=50;
        this.particles.scorePopup(s.x,s.y-15,'KILL +50',C.aiColors[idx].head);
        this.shakeAmt=6;this.gridPulse=.4;this.aiRespawnTimers[idx]=AI_RESPAWN_TIME;
    }

    aiRespawn(idx){
        const edges=[{x:randInt(2,WORLD-3),y:2},{x:randInt(2,WORLD-3),y:WORLD-3},{x:2,y:randInt(2,WORLD-3)},{x:WORLD-3,y:randInt(2,WORLD-3)}];
        const bodies=new Set();for(const sn of this.allSnakes())sn.body.forEach(p=>bodies.add(`${p.x},${p.y}`));
        for(const ep of edges){if(!bodies.has(`${ep.x},${ep.y}`)){const d=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}][randInt(0,3)];
            this.aiSnakes[idx]=this.makeSnake(ep.x,ep.y,4,d,idx);this.aiRespawnTimers[idx]=0;return;}}
        this.aiRespawnTimers[idx]=3;
    }

    gameOver(){
        this.state='GAMEOVER';this.deathTime=this.time;
        this.player.alive=false;
        this.audio.stopRewind();this.audio.death();
        const s=this.w2s(this.player.body[0].x,this.player.body[0].y);
        this.particles.explosion(s.x,s.y,50);this.shakeAmt=12;
        if(this.score>this.highScore){this.highScore=this.score;localStorage.setItem('neonSerpentHigh',this.highScore.toString());}
    }

    // ---- 更新 ----
    update(dt){
        this.time+=dt;
        if(this.state==='MENU'){this.updateMenu(dt);return;}
        if(this.state==='GAMEOVER'){this.particles.update(dt);this.shakeAmt*=.93;return;}
        if(this.isRewinding){this.rewindTick();}
        else{
            this.tickAcc+=dt;const iv=1/this.speed;let tk=0;
            while(this.tickAcc>=iv&&tk<3){this.tickAcc-=iv;tk++;this.playerTick();if(this.state!=='PLAYING')return;}
            this.interpFactor=clamp(this.tickAcc/iv,0,1);
            for(let i=0;i<this.aiSnakes.length;i++){const ai=this.aiSnakes[i];
                if(!ai.alive){this.aiRespawnTimers[i]-=dt;if(this.aiRespawnTimers[i]<=0)this.aiRespawn(i);continue;}
                const as=this.speed*.85;ai.tickAcc+=dt;while(ai.tickAcc>=1/as){ai.tickAcc-=1/as;this.aiTick(ai,i);}}
            this.timeEnergy=Math.min(ENERGY_MAX,this.timeEnergy+ENERGY_REGEN);this.ensureFood();
        }
        if(this.player?.alive){const h=this.player.body[0];
            this.camTargetX=h.x+this.player.dir.x*this.interpFactor;
            this.camTargetY=h.y+this.player.dir.y*this.interpFactor;}
        this.camX=lerp(this.camX,this.camTargetX,8*dt);this.camY=lerp(this.camY,this.camTargetY,8*dt);
        if(this.player?.alive&&this.player.body.length>1&&Math.random()<.3){
            const tail=this.player.body[this.player.body.length-1];
            if(this.isVisible(tail.x,tail.y)){const s=this.w2s(tail.x,tail.y);
                const cs=this.cellSize,t=lerpColor(C.bodyStart,C.bodyEnd,1);this.particles.trail(s.x,s.y,t);}}
        this.particles.update(dt);
        this.shakeAmt*=.9;if(this.shakeAmt<.1)this.shakeAmt=0;
        this.gridPulse*=.92;if(this.gridPulse<.01)this.gridPulse=0;
        this.shakeX=(Math.random()-.5)*this.shakeAmt*2;this.shakeY=(Math.random()-.5)*this.shakeAmt*2;
    }

    updateMenu(dt){
        this.menuAcc+=dt;this.menuTurnT-=dt;if(this.menuAcc<.08)return;this.menuAcc=0;
        if(this.menuTurnT<=0){this.menuTurnT=rand(.3,1.2);
            const ds=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>d.x!==-this.menuDir.x||d.y!==-this.menuDir.y);
            this.menuDir=ds[randInt(0,ds.length-1)];}
        const h=this.menuSnake[0];let nx=h.x+this.menuDir.x,ny=h.y+this.menuDir.y;
        if(nx<3||nx>=WORLD-3||ny<3||ny>=WORLD-3){
            const ds=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>d.x!==-this.menuDir.x||d.y!==-this.menuDir.y);
            this.menuDir=ds[randInt(0,ds.length-1)];nx=h.x+this.menuDir.x;ny=h.y+this.menuDir.y;}
        this.menuSnake.unshift({x:nx,y:ny});if(this.menuSnake.length>18)this.menuSnake.pop();
        this.particles.update(dt);
    }

    initMenuSnake(){
        this.menuSnake=[];const cx=25,cy=25;
        for(let i=0;i<12;i++)this.menuSnake.push({x:cx-i,y:cy});
        this.camX=cx;this.camY=cy;
    }

    // ---- 渲染（零 shadowBlur，高性能） ----
    render(){
        const ctx=this.ctx,w=this.W,h=this.H,g=this.glow;
        ctx.fillStyle=C.bg;ctx.fillRect(0,0,w,h);
        if(this.state==='MENU'){this.renderMenu(ctx,w,h,g);return;}
        // 游戏视口（GAMEOVER 和 PLAYING 都渲染）
        try{
            ctx.save();ctx.beginPath();ctx.rect(0,this.gameTop,this.gameW,this.gameH);ctx.clip();
            ctx.translate(this.shakeX,this.shakeY);
            this.renderGrid(ctx);
            this.renderFoods(ctx,g);
            for(let i=0;i<this.aiSnakes.length;i++){if(this.aiSnakes[i].alive)this.renderSnake(ctx,this.aiSnakes[i],C.aiColors[i],g);}
            if(this.player?.alive)this.renderSnake(ctx,this.player,null,g);
            this.particles.render(ctx,g);
            ctx.restore();
        }catch(e){console.error('render viewport error:',e);try{ctx.restore();}catch(e2){}}
        this.renderHUD(ctx,w);
        if(this.isTouch&&this.state==='PLAYING')this.renderJoystick(ctx,g);
        if(this.isRewinding)this.renderRewindFX(ctx,w,h);
        if(this.state==='PLAYING')this.renderMinimap(ctx);
        // GAMEOVER 必须最后渲染，独立于游戏视口
        if(this.state==='GAMEOVER'){
            // 死亡闪光
            const dt=this.time-this.deathTime;
            if(dt<.3){ctx.fillStyle=`rgba(255,0,68,${(.3-dt)/.3*.3})`;ctx.fillRect(0,0,w,h);}
            this.renderGameOver(ctx,w,h);
        }
    }

    renderGrid(ctx){
        const cs=this.cellSize;
        const sx=Math.floor(this.camX-VIEW_CELLS/2)-1,sy=Math.floor(this.camY-VIEW_CELLS/2)-1;
        const ex=sx+VIEW_CELLS+3,ey=sy+VIEW_CELLS+3;
        for(let gx=sx;gx<=ex;gx++){for(let gy=sy;gy<=ey;gy++){
            if(gx<0||gx>=WORLD||gy<0||gy>=WORLD)continue;
            const s=this.w2s(gx,gy);
            ctx.fillStyle=(gx+gy)%2===0?'#08081a':'#0a0a1e';
            ctx.fillRect(s.x,s.y,cs+1,cs+1);
        }}
        // 边界
        const tl=this.w2s(0,0),br=this.w2s(WORLD,WORLD);
        const ba=.4+this.gridPulse*.6;
        ctx.strokeStyle=`rgba(0,255,255,${ba})`;ctx.lineWidth=2;
        ctx.strokeRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
    }

    renderFoods(ctx,g){
        for(const f of this.foods){
            if(!this.isVisible(f.x,f.y))continue;
            const s=this.w2s(f.x,f.y),cs=this.cellSize;
            const pulse=1+Math.sin(this.time*4)*.1,r=cs*.3*pulse;
            // 发光
            g.drawGlow(ctx,s.x,s.y,r*2.5,C.foodGlow,.15);
            // 核心
            ctx.fillStyle=C.foodCore;ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fill();
            // 亮点
            ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(s.x-r*.15,s.y-r*.15,r*.25,0,Math.PI*2);ctx.fill();
        }
    }

    renderSnake(ctx,snake,colorInfo,g){
        const cs=this.cellSize,isP=!colorInfo;
        const hc=isP?C.headGlow:colorInfo.head,be=isP?C.bodyEnd:colorInfo.bodyEnd;
        const len=snake.body.length;
        // 连接线
        ctx.lineWidth=cs*.15;ctx.lineCap='round';
        for(let i=0;i<len-1;i++){
            const c=snake.body[i],n=snake.body[i+1];
            if(!this.isVisible(c.x,c.y)&&!this.isVisible(n.x,n.y))continue;
            const sc=this.w2s(c.x,c.y),sn=this.w2s(n.x,n.y);
            const ratio=i/Math.max(1,len-1);
            const col=isP?lerpColor(C.bodyStart,be,ratio):lerpColor(hc,be,ratio);
            ctx.globalAlpha=.35;ctx.strokeStyle=col;
            ctx.beginPath();ctx.moveTo(sc.x,sc.y);ctx.lineTo(sn.x,sn.y);ctx.stroke();
        }
        ctx.globalAlpha=1;
        // 身体段（尾到头）
        for(let i=len-1;i>=0;i--){
            const seg=snake.body[i];if(!this.isVisible(seg.x,seg.y))continue;
            const s=this.w2s(seg.x,seg.y);
            const ratio=i/Math.max(1,len-1);
            const sz=cs*lerp(.36,.22,ratio);
            const col=isP?lerpColor(C.bodyStart,be,ratio):lerpColor(hc,be,ratio);
            if(i===0){
                // 蛇头：大发光+主体+亮核+眼睛
                g.drawGlow(ctx,s.x,s.y,sz*2,hc,.2);
                ctx.fillStyle=hc;ctx.beginPath();ctx.arc(s.x,s.y,sz,0,Math.PI*2);ctx.fill();
                ctx.fillStyle=isP?C.headCore:'#fff';ctx.beginPath();ctx.arc(s.x,s.y,sz*.5,0,Math.PI*2);ctx.fill();
                const dir=isP?this.visualDir:snake.dir;
                const eo=sz*.3,er=sz*.13,px=-dir.y,py=dir.x;
                ctx.fillStyle='#001122';
                ctx.beginPath();ctx.arc(s.x+dir.x*eo*.5+px*eo,s.y+dir.y*eo*.5+py*eo,er,0,Math.PI*2);ctx.fill();
                ctx.beginPath();ctx.arc(s.x+dir.x*eo*.5-px*eo,s.y+dir.y*eo*.5-py*eo,er,0,Math.PI*2);ctx.fill();
            } else {
                g.drawGlow(ctx,s.x,s.y,sz*1.6,col,.1);
                ctx.fillStyle=col;ctx.beginPath();ctx.arc(s.x,s.y,sz,0,Math.PI*2);ctx.fill();
                ctx.fillStyle=`rgba(255,255,255,0.15)`;ctx.beginPath();ctx.arc(s.x,s.y,sz*.3,0,Math.PI*2);ctx.fill();
            }
        }
    }

    renderHUD(ctx,w){
        ctx.fillStyle='rgba(5,5,16,0.75)';ctx.fillRect(0,0,w,this.hudH);
        ctx.save();
        ctx.font='bold 20px "Courier New",monospace';ctx.fillStyle=C.scoreGlow;ctx.textAlign='left';
        ctx.fillText(`${this.score}`,20,34);
        ctx.font='10px "Courier New",monospace';ctx.fillStyle='rgba(0,255,255,0.4)';
        ctx.fillText('SCORE',20,13);
        ctx.fillStyle='rgba(255,80,80,0.7)';ctx.fillText(`KILL ${this.kills}`,110,34);
        if(this.combo>0&&Date.now()-this.lastEatTime<COMBO_TIMEOUT+400){
            const cs=1+Math.sin(this.time*8)*.08;
            ctx.font=`bold ${Math.round(18*cs)}px "Courier New",monospace`;
            ctx.fillStyle=C.comboGlow;ctx.textAlign='center';ctx.fillText(`${this.combo+1}x`,w/2,34);
        }
        const bw=Math.min(120,w*.22),bh=10,bx=w-bw-18,by=20;
        ctx.fillStyle=C.energyBg;ctx.fillRect(bx,by,bw,bh);
        const er=this.timeEnergy/ENERGY_MAX;
        ctx.fillStyle=C.energyBar;ctx.fillRect(bx,by,bw*er,bh);
        ctx.strokeStyle='rgba(255,0,170,0.3)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
        ctx.font='9px "Courier New",monospace';ctx.fillStyle='rgba(255,0,170,0.5)';ctx.textAlign='right';
        ctx.fillText('TIME',bx+bw,by-2);
        ctx.font='10px "Courier New",monospace';ctx.fillStyle='rgba(136,136,170,0.4)';ctx.textAlign='left';
        if(this.player)ctx.fillText(`LEN${this.player.body.length} SPD${this.speed.toFixed(0)}`,18,this.hudH-2);
        ctx.restore();
    }

    renderMinimap(ctx){
        const sz=Math.min(80,this.W*.18),mx=this.W-sz-8,my=this.gameTop+8,cs=sz/WORLD;
        ctx.save();ctx.fillStyle='rgba(5,5,20,0.75)';ctx.fillRect(mx-2,my-2,sz+4,sz+4);
        ctx.strokeStyle='rgba(0,255,255,0.25)';ctx.lineWidth=1;ctx.strokeRect(mx-2,my-2,sz+4,sz+4);
        ctx.fillStyle='rgba(255,170,0,0.4)';
        for(const f of this.foods)ctx.fillRect(mx+f.x*cs,my+f.y*cs,Math.max(1.5,cs),Math.max(1.5,cs));
        for(let i=0;i<this.aiSnakes.length;i++){const ai=this.aiSnakes[i];if(!ai.alive)continue;
            ctx.fillStyle=`rgba(${this.glow._parseColor(C.aiColors[i].head)},0.5)`;
            for(const p of ai.body)ctx.fillRect(mx+p.x*cs,my+p.y*cs,Math.max(1.5,cs),Math.max(1.5,cs));}
        if(this.player?.alive){ctx.fillStyle=C.headGlow;
            for(const p of this.player.body)ctx.fillRect(mx+p.x*cs,my+p.y*cs,Math.max(2,cs),Math.max(2,cs));}
        const vpW=(this.gameW/this.cellSize)*cs,vpH=(this.gameH/this.cellSize)*cs;
        ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
        ctx.strokeRect(mx+this.camX*cs-vpW/2,my+this.camY*cs-vpH/2,vpW,vpH);
        ctx.restore();
    }

    renderJoystick(ctx,g){
        const jp=this.getJP(),rp=this.getRP();
        ctx.fillStyle='rgba(5,5,16,0.85)';ctx.fillRect(0,this.gameBot,this.W,this.joyAreaH);
        ctx.strokeStyle='rgba(0,255,255,0.1)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(0,this.gameBot);ctx.lineTo(this.W,this.gameBot);ctx.stroke();
        // 底座
        ctx.save();ctx.globalAlpha=.4;
        ctx.beginPath();ctx.arc(jp.cx,jp.cy,jp.r,0,Math.PI*2);
        ctx.fillStyle=C.joyBase;ctx.fill();ctx.strokeStyle=C.joyBorder;ctx.lineWidth=2;ctx.stroke();ctx.restore();
        // 拇指
        const tx=jp.cx+(this.joyActive?this.joyX:0),ty=jp.cy+(this.joyActive?this.joyY:0);
        g.drawGlow(ctx,tx,ty,jp.tr*2,C.joyThumb,this.joyActive?.15:.05);
        ctx.fillStyle=hexRgba(C.joyThumb,this.joyActive?.6:.25);
        ctx.beginPath();ctx.arc(tx,ty,jp.tr,0,Math.PI*2);ctx.fill();
        // 方向提示
        ctx.save();ctx.font='bold 9px monospace';ctx.fillStyle='rgba(0,255,255,0.2)';ctx.textAlign='center';
        ctx.fillText('W',jp.cx,jp.cy-jp.r+11);ctx.fillText('S',jp.cx,jp.cy+jp.r-4);
        ctx.fillText('A',jp.cx-jp.r+9,jp.cy+3);ctx.fillText('D',jp.cx+jp.r-9,jp.cy+3);ctx.restore();
        // 倒流按钮
        ctx.beginPath();ctx.arc(rp.cx,rp.cy,rp.r,0,Math.PI*2);
        ctx.fillStyle=hexRgba(C.rewindBtn,this.isRewinding?.35:.12);ctx.fill();
        ctx.strokeStyle='rgba(255,0,170,0.4)';ctx.lineWidth=2;ctx.stroke();
        ctx.font=`bold ${Math.round(rp.r*.55)}px monospace`;ctx.fillStyle='rgba(255,0,170,0.7)';
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⏪',rp.cx,rp.cy);ctx.textBaseline='alphabetic';
    }

    renderRewindFX(ctx,w,h){
        ctx.fillStyle='rgba(255,120,0,0.04)';ctx.fillRect(0,0,w,h);
        ctx.save();ctx.globalAlpha=.03;
        for(let y=0;y<h;y+=4)if(Math.random()<.4){ctx.fillStyle=C.rewindTint;ctx.fillRect(0,y,w,1);}
        ctx.restore();
        const ra=.3+Math.sin(this.time*6)*.2;
        ctx.save();ctx.globalAlpha=ra;ctx.font='bold 13px monospace';ctx.fillStyle=C.rewindTint;
        ctx.textAlign='center';ctx.fillText('◄◄ REWIND ◄◄',w/2,this.gameTop+22);ctx.restore();
    }

    renderMenu(ctx,w,h,g){
        const cs=this.cellSize;
        for(let i=this.menuSnake.length-1;i>=0;i--){
            const seg=this.menuSnake[i],s=this.w2s(seg.x,seg.y);
            const ratio=i/Math.max(1,this.menuSnake.length-1);
            ctx.save();ctx.globalAlpha=lerp(.25,.08,ratio);
            const col=lerpColor(C.headGlow,C.bodyEnd,ratio);
            g.drawGlow(ctx,s.x,s.y,cs*.6,col,.15);
            ctx.fillStyle=col;ctx.beginPath();ctx.arc(s.x,s.y,cs*lerp(.25,.14,ratio),0,Math.PI*2);ctx.fill();
            ctx.restore();
        }
        this.particles.render(ctx,g);
        const ty=h*.26,tp=1+Math.sin(this.time*2)*.02;
        ctx.save();ctx.textAlign='center';
        ctx.font=`bold ${Math.round(48*tp)}px "Courier New",monospace`;
        g.drawGlow(ctx,w/2,ty-10,80,C.headGlow,.08);
        ctx.fillStyle=C.headGlow;ctx.fillText('NEON',w/2,ty);
        ctx.fillStyle=C.foodGlow;ctx.fillText('SERPENT',w/2,ty+48);
        ctx.font='15px "Courier New",monospace';ctx.fillStyle='rgba(255,0,255,0.6)';
        ctx.fillText('时 间 在 你 手 中',w/2,ty+82);ctx.restore();
        const iy=h*.55;
        ctx.save();ctx.textAlign='center';ctx.font='12px "Courier New",monospace';ctx.fillStyle='rgba(136,136,204,0.6)';
        ctx.fillText('50x50 开放地图 · 3个AI对手 · 抢食大战',w/2,iy);
        ctx.fillText('方向键/WASD — 转向 | SPACE — 时间倒流',w/2,iy+20);
        if(this.isTouch)ctx.fillText('摇杆 — 转向 | ⏪按钮 — 时间倒流',w/2,iy+40);
        ctx.restore();
        const ly=iy+(this.isTouch?62:42);
        ctx.save();ctx.font='11px "Courier New",monospace';ctx.textAlign='center';
        ctx.fillStyle=C.headGlow;ctx.fillText('● 玩家',w/2-70,ly);
        ctx.fillStyle=C.aiColors[0].head;ctx.fillText('● '+C.aiColors[0].name,w/2+10,ly);
        ctx.fillStyle=C.aiColors[1].head;ctx.fillText('● '+C.aiColors[1].name,w/2+85,ly);
        ctx.restore();
        const sa=.35+Math.sin(this.time*3)*.35;
        ctx.save();ctx.globalAlpha=sa;ctx.textAlign='center';
        ctx.font='bold 17px "Courier New",monospace';ctx.fillStyle='#fff';
        ctx.fillText(this.isTouch?'点击屏幕开始':'按 SPACE 或 点击屏幕 开始',w/2,h*.77);ctx.restore();
        if(this.highScore>0){ctx.save();ctx.textAlign='center';ctx.font='11px "Courier New",monospace';
            ctx.fillStyle='rgba(255,170,0,0.5)';ctx.fillText(`BEST: ${this.highScore}`,w/2,h*.83);ctx.restore();}
    }

    renderGameOver(ctx,w,h){
        // 全屏深色遮罩
        ctx.fillStyle='rgba(5,5,16,0.8)';ctx.fillRect(0,0,w,h);
        const cy=h*.32;
        ctx.save();
        ctx.textAlign='center';ctx.textBaseline='middle';
        // 标题
        ctx.font='bold 34px "Courier New",monospace';ctx.fillStyle='#ff0044';
        ctx.fillText('VOID COLLAPSE',w/2,cy);
        // 分数
        ctx.font='bold 30px "Courier New",monospace';ctx.fillStyle='#00ffff';
        ctx.fillText(String(this.score),w/2,cy+55);
        ctx.font='12px "Courier New",monospace';ctx.fillStyle='#00ffff';
        ctx.fillText('SCORE',w/2,cy+72);
        // 统计
        const pLen=this.player?this.player.body.length:0;
        ctx.font='13px "Courier New",monospace';ctx.fillStyle='#8888cc';
        ctx.fillText(`长度 ${pLen}  击杀 ${this.kills}  连击 ${this.maxCombo+1}x`,w/2,cy+100);
        // 最高分
        if(this.score>=this.highScore&&this.score>0){
            ctx.font='bold 15px "Courier New",monospace';ctx.fillStyle='#ffff44';
            ctx.fillText('NEW BEST',w/2,cy+130);
        } else {
            ctx.font='12px "Courier New",monospace';ctx.fillStyle='#ffaa00';
            ctx.fillText('BEST: '+this.highScore,w/2,cy+130);
        }
        // 重新开始提示（闪烁）
        ctx.globalAlpha=.4+Math.sin(this.time*3)*.4;
        ctx.font='bold 16px "Courier New",monospace';ctx.fillStyle='#ffffff';
        ctx.fillText(this.isTouch?'点击屏幕重新开始':'按 SPACE 重新开始',w/2,cy+170);
        ctx.restore();
    }

    run(){
        const loop=ts=>{
            if(!this.lastTime)this.lastTime=ts;
            const dt=Math.min((ts-this.lastTime)/1000,.04);
            this.lastTime=ts;this.update(dt);this.render();requestAnimationFrame(loop);
        };requestAnimationFrame(loop);
    }
}

function hexRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
new Game(document.getElementById('c')).run();
</script>
