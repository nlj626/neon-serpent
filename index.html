<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON SERPENT - 霓虹蛇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #050510;
            touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ==================== 配置 ====================
const WORLD=50, SNAKE_SPEED=8, SEG_SPACE=0.8, TURN_SPEED=10;
const MAX_HISTORY=300, REWIND_DRAIN=1.0, ENERGY_MAX=100, ENERGY_REGEN=0.10;
const COMBO_TIMEOUT=2200, PARTICLE_LIMIT=300;
const FOOD_TARGET=12, FOOD_MIN=7, AI_COUNT=3, AI_RESPAWN=12;
const AI_DEATH_RATE=0.4, VIEW_CELLS=26;
const EAT_RADIUS=0.8, HIT_RADIUS=0.45;
const INIT_LEN=5;

const C = {
    bg:'#0a0a1a', headCore:'#ffffff', headGlow:'#00ffff',
    bodyStart:'#00ffff', bodyEnd:'#6600cc',
    foodCore:'#ffff44', foodGlow:'#ffaa00',
    energyBar:'#ff00aa', energyBg:'#330033',
    scoreGlow:'#00ffff', comboGlow:'#ff00ff',
    rewindTint:'#ff6600', deathFlash:'#ff0044',
    aiColors:[
        {head:'#ff00ff',bodyEnd:'#880088',name:'VOID-A'},
        {head:'#00ff88',bodyEnd:'#006633',name:'VOID-B'},
        {head:'#ff8800',bodyEnd:'#884400',name:'VOID-C'},
    ],
    joyBase:'rgba(20,20,50,0.6)', joyBorder:'rgba(0,255,255,0.4)',
    joyThumb:'#00ffff', rewindBtn:'#ff00aa',
};

// ==================== 工具 ====================
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const rand=(a,b)=>Math.random()*(b-a)+a;
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const hexRgba=(hex,a)=>{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;};
const lerpColor=(c1,c2,t)=>{
    const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);
    const r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);
    return`rgb(${Math.round(lerp(r1,r2,t))},${Math.round(lerp(g1,g2,t))},${Math.round(lerp(b1,b2,t))})`;
};
// 角度差归一化到 [-PI, PI]
const angleDiff=(from,to)=>{let d=to-from;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;};

// ==================== 发光贴图缓存 ====================
class GlowCache {
    constructor(){this.cache=new Map();}
    get(color,size){
        const key=`${color}_${Math.ceil(size)}`;
        if(this.cache.has(key))return this.cache.get(key);
        const s=Math.max(4,Math.ceil(size*2));
        const cv=document.createElement('canvas');cv.width=s;cv.height=s;
        const ctx=cv.getContext('2d'),cx=s/2,cy=s/2,r=s/2;
        const rgb=this._rgb(color);
        const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
        g.addColorStop(0,`rgba(${rgb},0.8)`);g.addColorStop(0.3,`rgba(${rgb},0.35)`);
        g.addColorStop(0.7,`rgba(${rgb},0.08)`);g.addColorStop(1,`rgba(${rgb},0)`);
        ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
        this.cache.set(key,cv);return cv;
    }
    _rgb(c){if(c.startsWith('#')){return`${parseInt(c.slice(1,3),16)},${parseInt(c.slice(3,5),16)},${parseInt(c.slice(5,7),16)}`;}
        if(c.startsWith('rgb')){const m=c.match(/\d+/g);return m?m.slice(0,3).join(','):'';}return'255,255,255';}
    drawGlow(ctx,x,y,radius,color,alpha=1){
        const glow=this.get(color,radius);ctx.globalAlpha=alpha;ctx.drawImage(glow,x-glow.width/2,y-glow.height/2);}
}

// ==================== 音频 ====================
class Sfx {
    constructor(){this.ctx=null;this.on=true;}
    init(){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){this.on=false;}}
    resume(){if(this.ctx?.state==='suspended')this.ctx.resume();}
    _t(type,f1,f2,dur,vol=.08){
        if(!this.on||!this.ctx)return;const t=this.ctx.currentTime;
        const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur*.7);
        g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
        o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+dur);}
    eat(p=1){this._t('sine',400*p,900*p,.1);}
    combo(lv){this._t('triangle',600*(1+lv*.15),1300*(1+lv*.15),.08,.06);}
    kill(){this._t('square',200,80,.2,.06);}
    death(){if(!this.on||!this.ctx)return;const t=this.ctx.currentTime,n=this.ctx.sampleRate*.3,
        buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=buf.getChannelData(0);
        for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*.3;const s=this.ctx.createBufferSource();s.buffer=buf;
        const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(80,t+.25);
        const g=this.ctx.createGain();g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
        s.connect(f).connect(g).connect(this.ctx.destination);s.start(t);s.stop(t+.3);}
    startRw(){if(!this.on||!this.ctx)return;this._ro=this.ctx.createOscillator();this._rg=this.ctx.createGain();
        const l=this.ctx.createOscillator(),lg=this.ctx.createGain();this._ro.type='sawtooth';this._ro.frequency.value=55;
        l.type='sine';l.frequency.value=3;lg.gain.value=12;l.connect(lg).connect(this._ro.frequency);
        this._rg.gain.value=0;this._rg.gain.linearRampToValueAtTime(.05,this.ctx.currentTime+.1);
        this._ro.connect(this._rg).connect(this.ctx.destination);this._ro.start();l.start();this._rl=l;}
    stopRw(){if(!this._ro)return;try{this._rg.gain.linearRampToValueAtTime(0,this.ctx.currentTime+.1);
        setTimeout(()=>{try{this._ro.stop();this._rl.stop();}catch(e){}},150);}catch(e){}this._ro=null;}
}

// ==================== 粒子 ====================
class Particle {
    constructor(x,y,vx,vy,color,size,life,type='normal'){
        this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;
        this.size=Math.max(.5,size);this.ml=life;this.life=life;this.type=type;}
    update(dt){this.life-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;
        if(this.type==='float'){this.vy-=15*dt;this.vx*=.98;}
        else if(this.type==='spark'){this.vx*=.94;this.vy*=.94;}}
    get a(){return clamp(this.life/this.ml,0,1);}
    get dead(){return this.life<=0;}
}
class Particles {
    constructor(){this.p=[];this.reduced=false;}
    add(p){if(this.p.length<(this.reduced?150:PARTICLE_LIMIT))this.p.push(p);}
    burst(x,y,color,n=12){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(40,150);
        this.add(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,color,rand(1.5,3.5),rand(.2,.6),'spark'));}}
    explosion(x,y,n=30){const cols=[C.headGlow,C.foodGlow,C.comboGlow,'#ff0044','#fff'];
        for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(25,200);
        this.add(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,cols[randInt(0,4)],rand(1.5,5),rand(.3,1),'spark'));}}
    trail(x,y,color){this.add(new Particle(x+rand(-2,2),y+rand(-2,2),rand(-8,8),rand(-8,8),color,rand(1,2.5),rand(.12,.3),'float'));}
    popup(x,y,text,color){const p=new Particle(x,y,0,-50,color,0,.9,'text');p.text=text;this.add(p);}
    update(dt){for(let i=this.p.length-1;i>=0;i--){this.p[i].update(dt);if(this.p[i].dead)this.p.splice(i,1);}}
    render(ctx,g){
        for(const p of this.p){
            if(p.type==='text'){ctx.save();ctx.globalAlpha=p.a;ctx.font='bold 14px monospace';
                ctx.fillStyle=p.color;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.restore();}
            else{const r=Math.max(.5,p.size*p.a);
                g.drawGlow(ctx,p.x,p.y,r*3,p.color,p.a*.5);
                ctx.globalAlpha=p.a;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
        }
    }
}

// ==================== 主游戏 ====================
class Game {
    constructor(canvas){
        this.cv=canvas;this.ctx=canvas.getContext('2d');
        this.sfx=new Sfx();this.ptc=new Particles();this.glow=new GlowCache();
        this.isTouch='ontouchstart' in window;
        this.lowEnd=this.isTouch&&window.devicePixelRatio<=1;
        if(this.lowEnd)this.ptc.reduced=true;
        this.state='MENU';
        this.isRewinding=false;this.timeEnergy=ENERGY_MAX;
        this.score=0;this.highScore=parseInt(localStorage.getItem('ns2hi')||'0');
        this.combo=0;this.maxCombo=0;this.lastEatTime=0;
        this.foodEaten=0;this.kills=0;
        this.player=null;this.aiSnakes=[];this.aiTimers=[];
        this.foods=[];this.history=[];
        this.camX=25;this.camY=25;this.camTX=25;this.camTY=25;
        this.cellSize=0;this.shakeAmt=0;this.shakeX=0;this.shakeY=0;this.gridPulse=0;
        this.time=0;this.lastTime=0;this.deathTime=0;
        this.isLandscape=false;this.hudH=45;this.joyAreaH=0;
        this.gameTop=0;this.gameBot=0;this.gameH=0;this.gameW=0;
        // 摇杆
        this.joyActive=false;this.joyX=0;this.joyY=0;this.joyTouchId=null;
        this.joyAngle=0; // 摇杆当前角度
        this.rewindTouchId=null;
        // 键盘目标角度
        this.keyAngle=null;
        this.inputQueue=[];
        // 菜单
        this.menuSnake=null;this.menuAcc=0;
        this.resize();this.initInput();this.initMenu();
    }

    resize(){
        const dpr=this.lowEnd?1:(window.devicePixelRatio||1);
        this.cv.width=window.innerWidth*dpr;this.cv.height=window.innerHeight*dpr;
        this.ctx.setTransform(dpr,0,0,dpr,0,0);
        this.W=window.innerWidth;this.H=window.innerHeight;
        this.isLandscape=this.W>this.H;
        this.hudH=45;
        if(this.isLandscape||!this.isTouch)this.joyAreaH=0;else this.joyAreaH=130;
        this.gameTop=this.hudH;this.gameBot=this.H-this.joyAreaH;
        this.gameH=this.gameBot-this.gameTop;this.gameW=this.W;
        this.cellSize=Math.max(6,Math.floor(Math.min(this.gameW,this.gameH)/VIEW_CELLS));
        this.glow.cache.clear();
    }

    w2s(wx,wy){return{x:(wx-this.camX)*this.cellSize+this.gameW/2,y:(wy-this.camY)*this.cellSize+this.gameH/2+this.gameTop};}
    inView(wx,wy){const s=this.w2s(wx,wy),m=this.cellSize*3;return s.x>-m&&s.x<this.gameW+m&&s.y>this.gameTop-m&&s.y<this.gameBot+m;}

    // ---- 蛇创建 ----
    makeSnake(x,y,len,angle,ci=-1){
        const body=[];
        for(let i=0;i<len;i++) body.push({x:x-Math.cos(angle)*i*SEG_SPACE,y:y-Math.sin(angle)*i*SEG_SPACE});
        return{body,angle,targetAngle:angle,alive:true,ci,speed:SNAKE_SPEED,foodEaten:0,growPending:0};
    }

    // ---- 食物 ----
    spawnFood(){
        const occ=new Set();
        const add=sn=>sn.body.forEach(p=>occ.add(`${Math.round(p.x)},${Math.round(p.y)}`));
        if(this.player)add(this.player);
        this.aiSnakes.forEach(a=>{if(a.alive)add(a);});
        this.foods.forEach(f=>occ.add(`${Math.round(f.x)},${Math.round(f.y)}`));
        let t=0;while(t<200){
            const x=rand(2,WORLD-2),y=rand(2,WORLD-2);
            if(!occ.has(`${Math.round(x)},${Math.round(y)}`)){this.foods.push({x,y});return;}t++;}
    }
    ensureFood(){while(this.foods.length<FOOD_MIN)this.spawnFood();}

    // ---- 游戏开始 ----
    startGame(){
        this.sfx.init();this.sfx.resume();this.state='PLAYING';
        this.score=0;this.combo=0;this.maxCombo=0;this.lastEatTime=0;
        this.foodEaten=0;this.kills=0;
        this.timeEnergy=ENERGY_MAX;this.isRewinding=false;
        this.history=[];this.ptc.p=[];
        // 玩家：中心，朝右
        this.player=this.makeSnake(25,25,INIT_LEN,0);
        this.keyAngle=null;this.joyAngle=0;
        // AI：三个角落，不同角度
        this.aiSnakes=[];
        this.aiTimers=[];
        const sp=[{x:10,y:10,a:Math.PI*.25},{x:40,y:10,a:Math.PI*.75},{x:10,y:40,a:-Math.PI*.25}];
        for(let i=0;i<AI_COUNT;i++){
            this.aiSnakes.push(this.makeSnake(sp[i].x,sp[i].y,INIT_LEN,sp[i].a,i));
            this.aiTimers.push(0);
        }
        this.foods=[];for(let i=0;i<FOOD_TARGET;i++)this.spawnFood();
        this.camX=25;this.camY=25;this.camTX=25;this.camTY=25;
    }

    // ---- 蛇移动（通用） ----
    moveSnake(sn,dt){
        if(!sn.alive)return;
        // 平滑转向
        const diff=angleDiff(sn.angle,sn.targetAngle);
        const turn=Math.min(Math.abs(diff),TURN_SPEED*dt);
        sn.angle+=Math.sign(diff)*turn;
        // 移动头部
        const head=sn.body[0];
        head.x+=Math.cos(sn.angle)*sn.speed*dt;
        head.y+=Math.sin(sn.angle)*sn.speed*dt;
        // 身体跟随：每段保持固定距离
        for(let i=1;i<sn.body.length;i++){
            const prev=sn.body[i-1],cur=sn.body[i];
            const dx=prev.x-cur.x,dy=prev.y-cur.y;
            const d=Math.hypot(dx,dy);
            if(d>SEG_SPACE){
                const r=(d-SEG_SPACE)/d;
                cur.x+=dx*r;cur.y+=dy*r;
            }
        }
        // 目标段数
        const targetSegs=INIT_LEN+sn.foodEaten;
        // 增长：添加新段
        if(sn.growPending>0){sn.body.push({...sn.body[sn.body.length-1]});sn.growPending--;}
        // 裁剪尾部保持目标长度
        while(sn.body.length>targetSegs){sn.body.pop();}
    }

    // ---- 时间倒流 ----
    saveState(){
        this.history.push({
            body:this.player.body.map(p=>({...p})),angle:this.player.angle,
            foods:this.foods.map(f=>({...f})),score:this.score,foodEaten:this.foodEaten,combo:this.combo
        });
        if(this.history.length>MAX_HISTORY)this.history.shift();
    }
    rewindTick(){
        if(!this.history.length){this.isRewinding=false;this.sfx.stopRw();return;}
        for(let i=0;i<3&&this.history.length;i++){
            const s=this.history.pop();
            this.player.body=s.body;this.player.angle=s.angle;
            this.foods=s.foods;this.score=s.score;this.foodEaten=s.foodEaten;this.combo=s.combo;
        }
        this.timeEnergy-=REWIND_DRAIN;
        if(this.timeEnergy<=0){this.timeEnergy=0;this.isRewinding=false;this.sfx.stopRw();}
    }

    // ---- 碰撞检测 ----
    wallHit(x,y){return x<0||x>=WORLD||y<0||y>=WORLD;}
    bodyHit(headX,headY,snakes,skipHead=4){
        for(const sn of snakes){
            if(!sn.alive)continue;
            for(let i=skipHead;i<sn.body.length;i++){
                if(dist(headX,headY,sn.body[i].x,sn.body[i].y)<HIT_RADIUS*2)return true;
            }
        }
        return false;
    }

    // ---- 输入 ----
    queueAngle(a){if(this.inputQueue.length<5)this.inputQueue.push(a);}
    processInput(){
        // 摇杆优先，其次键盘
        if(this.joyActive){
            this.player.targetAngle=this.joyAngle;return;
        }
        if(this.keyAngle!==null){
            this.player.targetAngle=this.keyAngle;return;
        }
        // 没有输入时保持当前方向（不改变 targetAngle）
    }

    initInput(){
        const self=this;
        window.addEventListener('keydown',e=>{
            self.sfx.resume();
            if(self.state==='MENU'||self.state==='GAMEOVER'){if(e.code==='Space'||e.code==='Enter'){self.startGame();e.preventDefault();}return;}
            if(self.state==='PLAYING'){
                if(e.code==='Space'){if(!self.isRewinding&&self.timeEnergy>5){self.isRewinding=true;self.sfx.startRw();}e.preventDefault();return;}
                const am={'ArrowUp':-Math.PI/2,'KeyW':-Math.PI/2,'ArrowDown':Math.PI/2,'KeyS':Math.PI/2,
                    'ArrowLeft':Math.PI,'KeyA':Math.PI,'ArrowRight':0,'KeyD':0};
                if(am[e.code]!==undefined){self.keyAngle=am[e.code];e.preventDefault();}
            }
        });
        window.addEventListener('keyup',e=>{
            if(e.code==='Space'&&self.isRewinding){self.isRewinding=false;self.sfx.stopRw();}
            const am={'ArrowUp':1,'KeyW':1,'ArrowDown':1,'KeyS':1,'ArrowLeft':1,'KeyA':1,'ArrowRight':1,'KeyD':1};
            if(am[e.code]&&self.state==='PLAYING'){self.keyAngle=null;}
        });
        if(this.isTouch)this.initTouch();
        window.addEventListener('resize',()=>self.resize());
    }

    initTouch(){
        const self=this;
        this.getJP=()=>{
            if(this.isLandscape){const r=Math.min(this.H*.16,this.W*.07);return{cx:r+25,cy:this.H-r-20,r,tr:r*.4};}
            const cx=this.W/2,cy=this.gameBot+this.joyAreaH/2,r=Math.min(this.W*.17,this.joyAreaH*.33);return{cx,cy,r,tr:r*.4};};
        this.getRP=()=>{
            if(this.isLandscape){const r=Math.min(this.H*.1,this.W*.04);return{cx:this.W-r-25,cy:this.H-r-25,r};}
            const r=Math.min(this.W*.07,this.joyAreaH*.18);return{cx:this.W-r-18,cy:this.gameBot+this.joyAreaH/2,r};};
        this.cv.addEventListener('touchstart',e=>{e.preventDefault();self.sfx.resume();
            for(const t of e.changedTouches){
                if(self.state==='MENU'||self.state==='GAMEOVER'){self.startGame();return;}
                if(self.state!=='PLAYING')continue;
                const jp=self.getJP();
                if(dist(t.clientX,t.clientY,jp.cx,jp.cy)<jp.r*1.8){self.joyTouchId=t.identifier;self.joyActive=true;self.updJoy(t.clientX,t.clientY,jp);continue;}
                const rp=self.getRP();
                if(dist(t.clientX,t.clientY,rp.cx,rp.cy)<rp.r*1.5){self.rewindTouchId=t.identifier;
                    if(!self.isRewinding&&self.timeEnergy>5){self.isRewinding=true;self.sfx.startRw();}continue;}
            }
        },{passive:false});
        this.cv.addEventListener('touchmove',e=>{e.preventDefault();if(self.state!=='PLAYING')return;
            for(const t of e.changedTouches){if(t.identifier===self.joyTouchId)self.updJoy(t.clientX,t.clientY,self.getJP());}
        },{passive:false});
        const end=e=>{e.preventDefault();for(const t of e.changedTouches){
            if(t.identifier===self.joyTouchId){self.joyActive=false;self.joyTouchId=null;self.joyX=0;self.joyY=0;}
            if(t.identifier===self.rewindTouchId){self.rewindTouchId=null;if(self.isRewinding){self.isRewinding=false;self.sfx.stopRw();}}
        }};
        this.cv.addEventListener('touchend',end,{passive:false});
        this.cv.addEventListener('touchcancel',end,{passive:false});
    }

    updJoy(tx,ty,jp){
        let dx=tx-jp.cx,dy=ty-jp.cy;
        const d=Math.hypot(dx,dy),mx=jp.r*.8;
        if(d>mx){dx=dx/d*mx;dy=dy/d*mx;}
        this.joyX=dx;this.joyY=dy;
        if(d>jp.r*.2){this.joyAngle=Math.atan2(dy,dx);}
    }

    // ---- 更新 ----
    update(dt){
        this.time+=dt;
        if(this.state==='MENU'){this.updateMenu(dt);return;}
        if(this.state==='GAMEOVER'){this.ptc.update(dt);this.shakeAmt*=.93;return;}
        if(this.isRewinding){this.rewindTick();}
        else{
            this.saveState();
            this.processInput();
            // 移动玩家
            this.moveSnake(this.player,dt);
            const head=this.player.body[0];
            // 墙壁碰撞
            if(this.wallHit(head.x,head.y)){this.gameOver();return;}
            // 自身碰撞（跳过头部附近几段）
            for(let i=5;i<this.player.body.length;i++){
                if(dist(head.x,head.y,this.player.body[i].x,this.player.body[i].y)<HIT_RADIUS*2){this.gameOver();return;}}
            // AI蛇碰撞
            for(const ai of this.aiSnakes){
                if(!ai.alive)continue;
                for(const seg of ai.body){
                    if(dist(head.x,head.y,seg.x,seg.y)<HIT_RADIUS*2){this.gameOver();return;}}
            }
            // 吃食物
            for(let i=this.foods.length-1;i>=0;i--){
                if(dist(head.x,head.y,this.foods[i].x,this.foods[i].y)<EAT_RADIUS){
                    this.eatFood(this.foods[i]);this.foods.splice(i,1);}
            }
            // AI更新
            for(let i=0;i<this.aiSnakes.length;i++){
                const ai=this.aiSnakes[i];
                if(!ai.alive){this.aiTimers[i]-=dt;if(this.aiTimers[i]<=0)this.aiRespawn(i);continue;}
                this.aiUpdate(ai,dt);
                const ah=ai.body[0];
                if(this.wallHit(ah.x,ah.y)){this.aiDeath(ai,i);continue;}
                // AI碰所有蛇
                const all=this.allSnakes();
                for(const sn of all){
                    if(!sn.alive)continue;
                    const skip=sn===ai?5:0;
                    for(let j=skip;j<sn.body.length;j++){
                        if(dist(ah.x,ah.y,sn.body[j].x,sn.body[j].y)<HIT_RADIUS*2){this.aiDeath(ai,i);break;}}
                    if(!ai.alive)break;
                }
                // AI吃食物
                if(ai.alive){for(let fi=this.foods.length-1;fi>=0;fi--){
                    if(dist(ah.x,ah.y,this.foods[fi].x,this.foods[fi].y)<EAT_RADIUS){ai.foodEaten++;ai.growPending++;this.foods.splice(fi,1);break;}}
                }
            }
            this.timeEnergy=Math.min(ENERGY_MAX,this.timeEnergy+ENERGY_REGEN);
            this.ensureFood();
        }
        // 摄像机跟随玩家头部
        if(this.player?.alive){
            const h=this.player.body[0];
            this.camTX=h.x;this.camTY=h.y;
        }
        this.camX=lerp(this.camX,this.camTX,8*dt);
        this.camY=lerp(this.camY,this.camTY,8*dt);
        // 尾部拖尾粒子
        if(this.player?.alive&&this.player.body.length>2&&Math.random()<.3){
            const tail=this.player.body[this.player.body.length-1];
            if(this.inView(tail.x,tail.y)){const s=this.w2s(tail.x,tail.y);this.ptc.trail(s.x,s.y,lerpColor(C.bodyStart,C.bodyEnd,1));}
        }
        this.ptc.update(dt);
        this.shakeAmt*=.9;if(this.shakeAmt<.1)this.shakeAmt=0;
        this.gridPulse*=.92;if(this.gridPulse<.01)this.gridPulse=0;
        this.shakeX=(Math.random()-.5)*this.shakeAmt*2;
        this.shakeY=(Math.random()-.5)*this.shakeAmt*2;
    }

    allSnakes(){return[this.player,...this.aiSnakes.filter(a=>a.alive)];}

    eatFood(pos){
        const now=Date.now();
        if(now-this.lastEatTime<COMBO_TIMEOUT)this.combo=Math.min(this.combo+1,5);else this.combo=0;
        this.lastEatTime=now;if(this.combo>this.maxCombo)this.maxCombo=this.combo;
        const pts=10*(this.combo+1);this.score+=pts;this.foodEaten++;
        this.player.growPending++;
        const s=this.w2s(pos.x,pos.y);
        this.ptc.burst(s.x,s.y,C.foodCore,12);
        this.ptc.popup(s.x,s.y-8,`+${pts}`,this.combo>0?C.comboGlow:C.foodGlow);
        this.sfx.eat(1+this.combo*.1);if(this.combo>0)this.sfx.combo(this.combo);
        this.shakeAmt=Math.min(2+this.combo,5);this.gridPulse=.3;
        this.ensureFood();
    }

    // ---- AI ----
    aiUpdate(ai,dt){
        // 找最近食物
        let nearF=null,bestD=Infinity;
        for(const f of this.foods){const d=dist(ai.body[0].x,ai.body[0].y,f.x,f.y);if(d<bestD){bestD=d;nearF=f;}}
        if(nearF){
            const targetAngle=Math.atan2(nearF.y-ai.body[0].y,nearF.x-ai.body[0].x);
            // 加一点随机抖动让AI不那么完美
            ai.targetAngle=targetAngle+rand(-.3,.3);
        }
        // 避墙：如果前方接近墙壁，转向中心
        const lookAhead=3;
        const fx=ai.body[0].x+Math.cos(ai.angle)*lookAhead;
        const fy=ai.body[0].y+Math.sin(ai.angle)*lookAhead;
        if(fx<2||fx>WORLD-2||fy<2||fy>WORLD-2){
            ai.targetAngle=Math.atan2(WORLD/2-ai.body[0].y,WORLD/2-ai.body[0].x);
        }
        this.moveSnake(ai,dt);
    }

    aiDeath(ai,idx){
        ai.alive=false;
        const s=this.w2s(ai.body[0].x,ai.body[0].y);
        this.ptc.explosion(s.x,s.y,30);
        for(const seg of ai.body){if(Math.random()<AI_DEATH_RATE){
            if(!this.foods.some(f=>dist(f.x,f.y,seg.x,seg.y)<1))this.foods.push({x:seg.x,y:seg.y});}}
        this.sfx.kill();this.kills++;this.score+=50;
        this.ptc.popup(s.x,s.y-15,'KILL +50',C.aiColors[idx].head);
        this.shakeAmt=6;this.gridPulse=.4;this.aiTimers[idx]=AI_RESPAWN;
    }

    aiRespawn(idx){
        const edges=[{x:rand(3,WORLD-3),y:3},{x:rand(3,WORLD-3),y:WORLD-3},{x:3,y:rand(3,WORLD-3)},{x:WORLD-3,y:rand(3,WORLD-3)}];
        for(const ep of edges){
            const a=Math.atan2(WORLD/2-ep.y,WORLD/2-ep.x);
            this.aiSnakes[idx]=this.makeSnake(ep.x,ep.y,INIT_LEN,a,idx);
            this.aiTimers[idx]=0;return;
        }
        this.aiTimers[idx]=3;
    }

    gameOver(){
        this.state='GAMEOVER';this.deathTime=this.time;
        this.player.alive=false;this.sfx.stopRw();this.sfx.death();
        const s=this.w2s(this.player.body[0].x,this.player.body[0].y);
        this.ptc.explosion(s.x,s.y,50);this.shakeAmt=12;
        if(this.score>this.highScore){this.highScore=this.score;localStorage.setItem('ns2hi',this.highScore.toString());}
    }

    // ---- 菜单 ----
    initMenu(){
        this.menuSnake=this.makeSnake(25,25,15,0);
        this.menuSnake.targetAngle=Math.PI*.15;
        this.menuSnake.foodEaten=10; // 菜单蛇显示为15段
    }
    updateMenu(dt){
        this.menuAcc+=dt;if(this.menuAcc<.02)return;this.menuAcc=0;
        // 自动游走
        const h=this.menuSnake.body[0];
        const fx=h.x+Math.cos(this.menuSnake.angle)*3;
        const fy=h.y+Math.sin(this.menuSnake.angle)*3;
        if(fx<4||fx>WORLD-4||fy<4||fy>WORLD-4){
            this.menuSnake.targetAngle=Math.atan2(WORLD/2-h.y,WORLD/2-h.x)+rand(-.5,.5);
        }
        this.moveSnake(this.menuSnake,.02);
        this.ptc.update(dt);
    }

    // ==================== 渲染 ====================
    render(){
        const ctx=this.ctx,w=this.W,h=this.H,g=this.glow;
        ctx.fillStyle=C.bg;ctx.fillRect(0,0,w,h);
        if(this.state==='MENU'){this.renderMenu(ctx,w,h,g);return;}
        try{
            ctx.save();ctx.beginPath();ctx.rect(0,this.gameTop,this.gameW,this.gameH);ctx.clip();
            ctx.translate(this.shakeX,this.shakeY);
            this.renderGrid(ctx);
            this.renderFoods(ctx,g);
            for(let i=0;i<this.aiSnakes.length;i++){if(this.aiSnakes[i].alive)this.renderSnake(ctx,this.aiSnakes[i],C.aiColors[i],g);}
            if(this.player?.alive)this.renderSnake(ctx,this.player,null,g);
            this.ptc.render(ctx,g);
            ctx.restore();
        }catch(e){console.error(e);try{ctx.restore();}catch(e2){}}
        this.renderHUD(ctx,w);
        if(this.isTouch&&!this.isLandscape){ctx.save();ctx.globalAlpha=.5;const by=h-26;
            ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,by,w,26);
            ctx.font='11px "Courier New",monospace';ctx.fillStyle='#0ff';ctx.textAlign='center';
            ctx.fillText('↻ 横屏体验更佳',w/2,by+17);ctx.restore();}
        if(this.isTouch&&this.state==='PLAYING')this.renderJoystick(ctx,g);
        if(this.isRewinding)this.renderRwFX(ctx,w,h);
        if(this.state==='PLAYING')this.renderMinimap(ctx);
        if(this.state==='GAMEOVER'){
            const dt=this.time-this.deathTime;
            if(dt<.3){ctx.fillStyle=`rgba(255,0,68,${(.3-dt)/.3*.3})`;ctx.fillRect(0,0,w,h);}
            this.renderGameOver(ctx,w,h);
        }
    }

    renderGrid(ctx){
        const cs=this.cellSize;
        const sx=Math.floor(this.camX-VIEW_CELLS/2)-1,sy=Math.floor(this.camY-VIEW_CELLS/2)-1;
        const ex=sx+VIEW_CELLS+3,ey=sy+VIEW_CELLS+3;
        for(let gx=sx;gx<=ex;gx++){for(let gy=sy;gy<=ey;gy++){
            if(gx<0||gx>=WORLD||gy<0||gy>=WORLD)continue;
            const s=this.w2s(gx,gy);
            ctx.fillStyle=(gx+gy)%2===0?'#08081a':'#0a0a1e';ctx.fillRect(s.x,s.y,cs+1,cs+1);
        }}
        const tl=this.w2s(0,0),br=this.w2s(WORLD,WORLD);
        const ba=.4+this.gridPulse*.6;
        ctx.strokeStyle=`rgba(0,255,255,${ba})`;ctx.lineWidth=2;
        ctx.strokeRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
    }

    renderFoods(ctx,g){
        for(const f of this.foods){
            if(!this.inView(f.x,f.y))continue;
            const s=this.w2s(f.x,f.y),cs=this.cellSize;
            const pulse=1+Math.sin(this.time*4)*.1,r=cs*.28*pulse;
            g.drawGlow(ctx,s.x,s.y,r*2.5,C.foodGlow,.12);
            ctx.fillStyle=C.foodCore;ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x-r*.15,s.y-r*.15,r*.25,0,Math.PI*2);ctx.fill();
        }
    }

    renderSnake(ctx,sn,colorInfo,g){
        const cs=this.cellSize,isP=!colorInfo;
        const hc=isP?C.headGlow:colorInfo.head,be=isP?C.bodyEnd:colorInfo.bodyEnd;
        const len=sn.body.length;
        // 连接线
        ctx.lineWidth=cs*.14;ctx.lineCap='round';
        for(let i=0;i<len-1;i++){
            const c=sn.body[i],n=sn.body[i+1];
            if(!this.inView(c.x,c.y)&&!this.inView(n.x,n.y))continue;
            const sc=this.w2s(c.x,c.y),sn2=this.w2s(n.x,n.y);
            const ratio=i/Math.max(1,len-1);
            ctx.globalAlpha=.3;ctx.strokeStyle=isP?lerpColor(C.bodyStart,be,ratio):lerpColor(hc,be,ratio);
            ctx.beginPath();ctx.moveTo(sc.x,sc.y);ctx.lineTo(sn2.x,sn2.y);ctx.stroke();
        }
        ctx.globalAlpha=1;
        // 身体段
        for(let i=len-1;i>=0;i--){
            const seg=sn.body[i];if(!this.inView(seg.x,seg.y))continue;
            const s=this.w2s(seg.x,seg.y);
            const ratio=i/Math.max(1,len-1);
            const sz=cs*lerp(.34,.2,ratio);
            const col=isP?lerpColor(C.bodyStart,be,ratio):lerpColor(hc,be,ratio);
            if(i===0){
                g.drawGlow(ctx,s.x,s.y,sz*2,hc,.2);
                ctx.fillStyle=hc;ctx.beginPath();ctx.arc(s.x,s.y,sz,0,Math.PI*2);ctx.fill();
                ctx.fillStyle=isP?C.headCore:'#fff';ctx.beginPath();ctx.arc(s.x,s.y,sz*.5,0,Math.PI*2);ctx.fill();
                // 方向指示（小三角）
                const dx=Math.cos(sn.angle),dy=Math.sin(sn.angle);
                ctx.fillStyle=isP?C.headCore:'#fff';ctx.globalAlpha=.6;
                ctx.beginPath();ctx.moveTo(s.x+dx*sz*.7,s.y+dy*sz*.7);
                ctx.lineTo(s.x+(-dy-dx)*sz*.25,s.y+(dx-dy)*sz*.25);
                ctx.lineTo(s.x+(dy-dx)*sz*.25,s.y+(-dx-dy)*sz*.25);ctx.fill();
                ctx.globalAlpha=1;
            } else {
                g.drawGlow(ctx,s.x,s.y,sz*1.6,col,.08);
                ctx.fillStyle=col;ctx.beginPath();ctx.arc(s.x,s.y,sz,0,Math.PI*2);ctx.fill();
                ctx.fillStyle='rgba(255,255,255,0.12)';ctx.beginPath();ctx.arc(s.x,s.y,sz*.3,0,Math.PI*2);ctx.fill();
            }
        }
    }

    renderHUD(ctx,w){
        ctx.fillStyle='rgba(5,5,16,0.75)';ctx.fillRect(0,0,w,this.hudH);
        ctx.save();ctx.textAlign='left';
        ctx.font='bold 20px "Courier New",monospace';ctx.fillStyle=C.scoreGlow;ctx.fillText(`${this.score}`,20,32);
        ctx.font='10px "Courier New",monospace';ctx.fillStyle='rgba(0,255,255,0.4)';ctx.fillText('SCORE',20,12);
        ctx.fillStyle='rgba(255,80,80,0.7)';ctx.fillText(`KILL ${this.kills}`,110,32);
        if(this.combo>0&&Date.now()-this.lastEatTime<COMBO_TIMEOUT+400){
            ctx.font=`bold ${Math.round(18*(1+Math.sin(this.time*8)*.08))}px "Courier New",monospace`;
            ctx.fillStyle=C.comboGlow;ctx.textAlign='center';ctx.fillText(`${this.combo+1}x`,w/2,32);}
        const bw=Math.min(120,w*.22),bh=10,bx=w-bw-18,by=18;
        ctx.fillStyle=C.energyBg;ctx.fillRect(bx,by,bw,bh);
        const er=this.timeEnergy/ENERGY_MAX;ctx.fillStyle=C.energyBar;ctx.fillRect(bx,by,bw*er,bh);
        ctx.strokeStyle='rgba(255,0,170,0.3)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
        ctx.font='9px "Courier New",monospace';ctx.fillStyle='rgba(255,0,170,0.5)';ctx.textAlign='right';ctx.fillText('TIME',bx+bw,by-2);
        ctx.restore();
    }

    renderMinimap(ctx){
        const sz=Math.min(80,this.W*.18),mx=this.W-sz-8,my=this.gameTop+8,cs=sz/WORLD;
        ctx.save();ctx.fillStyle='rgba(5,5,20,0.75)';ctx.fillRect(mx-2,my-2,sz+4,sz+4);
        ctx.strokeStyle='rgba(0,255,255,0.25)';ctx.lineWidth=1;ctx.strokeRect(mx-2,my-2,sz+4,sz+4);
        ctx.fillStyle='rgba(255,170,0,0.4)';
        for(const f of this.foods)ctx.fillRect(mx+f.x*cs,my+f.y*cs,Math.max(1.5,cs),Math.max(1.5,cs));
        for(let i=0;i<this.aiSnakes.length;i++){const ai=this.aiSnakes[i];if(!ai.alive)continue;
            ctx.fillStyle=hexRgba(C.aiColors[i].head,.5);for(const p of ai.body)ctx.fillRect(mx+p.x*cs,my+p.y*cs,Math.max(1.5,cs),Math.max(1.5,cs));}
        if(this.player?.alive){ctx.fillStyle=C.headGlow;for(const p of this.player.body)ctx.fillRect(mx+p.x*cs,my+p.y*cs,Math.max(2,cs),Math.max(2,cs));}
        ctx.restore();
    }

    renderJoystick(ctx,g){
        const jp=this.getJP(),rp=this.getRP();
        if(!this.isLandscape&&this.joyAreaH>0){
            ctx.fillStyle='rgba(5,5,16,0.85)';ctx.fillRect(0,this.gameBot,this.W,this.joyAreaH);
            ctx.strokeStyle='rgba(0,255,255,0.1)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,this.gameBot);ctx.lineTo(this.W,this.gameBot);ctx.stroke();}
        ctx.save();ctx.globalAlpha=this.isLandscape?.25:.4;
        ctx.beginPath();ctx.arc(jp.cx,jp.cy,jp.r,0,Math.PI*2);
        ctx.fillStyle=C.joyBase;ctx.fill();ctx.strokeStyle=C.joyBorder;ctx.lineWidth=2;ctx.stroke();ctx.restore();
        const tx=jp.cx+(this.joyActive?this.joyX:0),ty=jp.cy+(this.joyActive?this.joyY:0);
        g.drawGlow(ctx,tx,ty,jp.tr*2,C.joyThumb,this.joyActive?.15:.05);
        ctx.fillStyle=hexRgba(C.joyThumb,this.joyActive?.6:.25);ctx.beginPath();ctx.arc(tx,ty,jp.tr,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(rp.cx,rp.cy,rp.r,0,Math.PI*2);
        ctx.fillStyle=hexRgba(C.rewindBtn,this.isRewinding?.35:.12);ctx.fill();
        ctx.strokeStyle='rgba(255,0,170,0.4)';ctx.lineWidth=2;ctx.stroke();
        ctx.font=`bold ${Math.round(rp.r*.55)}px monospace`;ctx.fillStyle='rgba(255,0,170,0.7)';
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⏪',rp.cx,rp.cy);ctx.textBaseline='alphabetic';
    }

    renderRwFX(ctx,w,h){
        ctx.fillStyle='rgba(255,120,0,0.04)';ctx.fillRect(0,0,w,h);
        ctx.save();ctx.globalAlpha=.3+Math.sin(this.time*6)*.2;ctx.font='bold 13px monospace';
        ctx.fillStyle=C.rewindTint;ctx.textAlign='center';ctx.fillText('◄◄ REWIND ◄◄',w/2,this.gameTop+22);ctx.restore();
    }

    renderMenu(ctx,w,h,g){
        // 背景蛇
        const ms=this.menuSnake;
        if(ms){const hc=C.headGlow,be=C.bodyEnd;
            const len=ms.body.length;ctx.lineWidth=this.cellSize*.12;ctx.lineCap='round';
            for(let i=0;i<len-1;i++){
                const c=ms.body[i],n=ms.body[i+1];
                if(!this.inView(c.x,c.y)&&!this.inView(n.x,n.y))continue;
                const sc=this.w2s(c.x,c.y),sn=this.w2s(n.x,n.y);
                const ratio=i/Math.max(1,len-1);ctx.globalAlpha=lerp(.2,.05,ratio);
                ctx.strokeStyle=lerpColor(hc,be,ratio);ctx.beginPath();ctx.moveTo(sc.x,sc.y);ctx.lineTo(sn.x,sn.y);ctx.stroke();}
            for(let i=len-1;i>=0;i-=2){const seg=ms.body[i];if(!this.inView(seg.x,seg.y))continue;
                const s=this.w2s(seg.x,seg.y);const ratio=i/Math.max(1,len-1);
                ctx.globalAlpha=lerp(.15,.03,ratio);ctx.fillStyle=lerpColor(hc,be,ratio);
                ctx.beginPath();ctx.arc(s.x,s.y,this.cellSize*lerp(.2,.1,ratio),0,Math.PI*2);ctx.fill();}
            ctx.globalAlpha=1;}
        this.ptc.render(ctx,g);
        const ty=h*.26;
        ctx.save();ctx.textAlign='center';
        ctx.font=`bold ${Math.round(48*(1+Math.sin(this.time*2)*.02))}px "Courier New",monospace`;
        g.drawGlow(ctx,w/2,ty-10,80,C.headGlow,.06);
        ctx.fillStyle=C.headGlow;ctx.fillText('NEON',w/2,ty);
        ctx.fillStyle=C.foodGlow;ctx.fillText('SERPENT',w/2,ty+48);
        ctx.font='15px "Courier New",monospace';ctx.fillStyle='rgba(255,0,255,0.6)';
        ctx.fillText('360° 自由操控',w/2,ty+82);ctx.restore();
        const iy=h*.55;ctx.save();ctx.textAlign='center';ctx.font='12px "Courier New",monospace';ctx.fillStyle='rgba(136,136,204,0.6)';
        ctx.fillText('摇杆 360° 控制 | SPACE/⏪ 时间倒流',w/2,iy);ctx.restore();
        const ly=iy+24;ctx.save();ctx.font='11px "Courier New",monospace';ctx.textAlign='center';
        ctx.fillStyle=C.headGlow;ctx.fillText('● 玩家',w/2-60,ly);
        ctx.fillStyle=C.aiColors[0].head;ctx.fillText('● '+C.aiColors[0].name,w/2+10,ly);
        ctx.fillStyle=C.aiColors[1].head;ctx.fillText('● '+C.aiColors[1].name,w/2+75,ly);ctx.restore();
        ctx.save();ctx.globalAlpha=.35+Math.sin(this.time*3)*.35;ctx.textAlign='center';
        ctx.font='bold 17px "Courier New",monospace';ctx.fillStyle='#fff';
        ctx.fillText(this.isTouch?'点击屏幕开始':'按 SPACE 开始',w/2,h*.77);ctx.restore();
        if(this.highScore>0){ctx.save();ctx.textAlign='center';ctx.font='11px "Courier New",monospace';
            ctx.fillStyle='rgba(255,170,0,0.5)';ctx.fillText(`BEST: ${this.highScore}`,w/2,h*.83);ctx.restore();}
    }

    renderGameOver(ctx,w,h){
        ctx.fillStyle='rgba(5,5,16,0.8)';ctx.fillRect(0,0,w,h);
        const cy=h*.32;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.font='bold 34px "Courier New",monospace';ctx.fillStyle='#ff0044';ctx.fillText('VOID COLLAPSE',w/2,cy);
        ctx.font='bold 30px "Courier New",monospace';ctx.fillStyle='#0ff';ctx.fillText(String(this.score),w/2,cy+55);
        ctx.font='12px "Courier New",monospace';ctx.fillStyle='#0ff';ctx.fillText('SCORE',w/2,cy+72);
        const pLen=this.player?this.player.body.length:0;
        ctx.font='13px "Courier New",monospace';ctx.fillStyle='#8888cc';
        ctx.fillText(`长度 ${pLen}  击杀 ${this.kills}  连击 ${this.maxCombo+1}x`,w/2,cy+100);
        if(this.score>=this.highScore&&this.score>0){
            ctx.font='bold 15px "Courier New",monospace';ctx.fillStyle='#ffff44';ctx.fillText('NEW BEST',w/2,cy+130);
        }else{ctx.font='12px "Courier New",monospace';ctx.fillStyle='#ffaa00';ctx.fillText('BEST: '+this.highScore,w/2,cy+130);}
        ctx.globalAlpha=.4+Math.sin(this.time*3)*.4;ctx.font='bold 16px "Courier New",monospace';ctx.fillStyle='#fff';
        ctx.fillText(this.isTouch?'点击屏幕重新开始':'按 SPACE 重新开始',w/2,cy+170);ctx.restore();
    }

    run(){
        const loop=ts=>{
            if(!this.lastTime)this.lastTime=ts;
            const dt=Math.min((ts-this.lastTime)/1000,.04);this.lastTime=ts;
            this.update(dt);this.render();requestAnimationFrame(loop);
        };requestAnimationFrame(loop);
    }
}

new Game(document.getElementById('c')).run();
</script>
