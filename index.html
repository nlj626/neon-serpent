<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON SERPENT - 霓虹蛇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #050510;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ==================== 配置常量 ====================
const GRID = 25;                   // 网格尺寸 25x25
const BASE_SPEED = 9;              // 初始速度（格/秒）
const MAX_SPEED = 20;              // 最大速度
const SPEED_INC = 0.35;            // 每吃5个食物增加的速度
const MAX_HISTORY = 360;           // 最大历史帧数（约36秒）
const REWIND_DRAIN = 1.2;          // 每帧倒流能量消耗
const ENERGY_MAX = 100;            // 时间能量上限
const ENERGY_REGEN = 0.12;         // 每帧能量回复
const COMBO_TIMEOUT = 2200;        // 连击超时（毫秒）
const PARTICLE_LIMIT = 600;        // 粒子数量上限

// 颜色配置
const C = {
    bg: '#0a0a1a',
    gridLine: '#0f0f25',
    gridBright: '#1a1a3a',
    headCore: '#ffffff',
    headGlow: '#00ffff',
    bodyStart: '#00ffff',
    bodyEnd: '#6600cc',
    foodCore: '#ffff44',
    foodGlow: '#ffaa00',
    energyBar: '#ff00aa',
    energyBg: '#330033',
    text: '#ffffff',
    scoreGlow: '#00ffff',
    comboGlow: '#ff00ff',
    rewindOverlay: 'rgba(255, 120, 0, 0.08)',
    rewindTint: '#ff6600',
    deathFlash: '#ff0044',
    voidPurple: '#2a0044',
};

// ==================== 工具函数 ====================
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
function hsl(h, s, l) { return `hsl(${h}, ${s}%, ${l}%)`; }

// 将十六进制颜色转为 rgba
function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// 插值两个颜色
function lerpColor(c1, c2, t) {
    const r1 = parseInt(c1.slice(1, 3), 16), g1 = parseInt(c1.slice(3, 5), 16), b1 = parseInt(c1.slice(5, 7), 16);
    const r2 = parseInt(c2.slice(1, 3), 16), g2 = parseInt(c2.slice(3, 5), 16), b2 = parseInt(c2.slice(5, 7), 16);
    const r = Math.round(lerp(r1, r2, t)), g = Math.round(lerp(g1, g2, t)), b = Math.round(lerp(b1, b2, t));
    return `rgb(${r}, ${g}, ${b})`;
}

// ==================== 音频系统（Web Audio API 程序化生成） ====================
class AudioSystem {
    constructor() {
        this.ctx = null;
        this.enabled = true;
    }

    init() {
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            this.enabled = false;
        }
    }

    resume() {
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }

    // 吃食物音效：快速上升音调
    playEat(pitch = 1) {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400 * pitch, t);
        osc.frequency.exponentialRampToValueAtTime(800 * pitch, t + 0.08);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
    }

    // 连击音效：更高的叮声
    playCombo(level) {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const pitch = 1 + level * 0.15;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600 * pitch, t);
        osc.frequency.exponentialRampToValueAtTime(1200 * pitch, t + 0.06);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.12);
    }

    // 死亡音效：下降噪声
    playDeath() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const bufSize = this.ctx.sampleRate * 0.4;
        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3000, t);
        filter.frequency.exponentialRampToValueAtTime(100, t + 0.35);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        noise.connect(filter).connect(gain).connect(this.ctx.destination);
        noise.start(t);
        noise.stop(t + 0.4);
    }

    // 时间倒流音效：持续低沉嗡鸣
    startRewind() {
        if (!this.enabled || !this.ctx) return;
        this.rewindOsc = this.ctx.createOscillator();
        this.rewindGain = this.ctx.createGain();
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        this.rewindOsc.type = 'sawtooth';
        this.rewindOsc.frequency.value = 55;
        lfo.type = 'sine';
        lfo.frequency.value = 3;
        lfoGain.gain.value = 15;
        lfo.connect(lfoGain).connect(this.rewindOsc.frequency);
        this.rewindGain.gain.value = 0;
        this.rewindGain.gain.linearRampToValueAtTime(0.08, this.ctx.currentTime + 0.1);
        this.rewindOsc.connect(this.rewindGain).connect(this.ctx.destination);
        this.rewindOsc.start();
        lfo.start();
        this.rewindLfo = lfo;
    }

    stopRewind() {
        if (!this.rewindOsc) return;
        try {
            this.rewindGain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
            setTimeout(() => {
                try { this.rewindOsc.stop(); this.rewindLfo.stop(); } catch (e) {}
                this.rewindOsc = null;
                this.rewindLfo = null;
            }, 150);
        } catch (e) {}
    }
}

// ==================== 粒子系统 ====================
class Particle {
    constructor(x, y, vx, vy, color, size, life, type = 'normal') {
        this.x = x; this.y = y;
        this.vx = vx; this.vy = vy;
        this.color = color;
        this.size = Math.max(0.5, size);
        this.maxLife = life;
        this.life = life;
        this.type = type;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = rand(-3, 3);
    }
    update(dt) {
        this.life -= dt;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.angle += this.spin * dt;
        if (this.type === 'float') {
            this.vy -= 20 * dt; // 向上飘
            this.vx *= 0.98;
        } else if (this.type === 'spark') {
            this.vx *= 0.96;
            this.vy *= 0.96;
        }
    }
    get alpha() { return clamp(this.life / this.maxLife, 0, 1); }
    get dead() { return this.life <= 0; }
}

class ParticleSystem {
    constructor() { this.particles = []; }

    add(p) {
        if (this.particles.length < PARTICLE_LIMIT) this.particles.push(p);
    }

    // 吃食物的爆发粒子
    burst(x, y, color, count = 20) {
        for (let i = 0; i < count; i++) {
            const angle = rand(0, Math.PI * 2);
            const speed = rand(60, 200);
            this.add(new Particle(
                x, y,
                Math.cos(angle) * speed, Math.sin(angle) * speed,
                color, rand(2, 5), rand(0.3, 0.8), 'spark'
            ));
        }
    }

    // 死亡大爆炸
    explosion(x, y, count = 80) {
        for (let i = 0; i < count; i++) {
            const angle = rand(0, Math.PI * 2);
            const speed = rand(30, 300);
            const colors = [C.headGlow, C.foodGlow, C.comboGlow, '#ff0044', '#ffffff'];
            this.add(new Particle(
                x, y,
                Math.cos(angle) * speed, Math.sin(angle) * speed,
                colors[randInt(0, colors.length - 1)],
                rand(2, 7), rand(0.5, 1.5), 'spark'
            ));
        }
    }

    // 蛇尾拖尾粒子
    trail(x, y, color) {
        this.add(new Particle(
            x + rand(-3, 3), y + rand(-3, 3),
            rand(-15, 15), rand(-15, 15),
            color, rand(1.5, 3.5), rand(0.2, 0.5), 'float'
        ));
    }

    // 食物光环粒子
    foodHalo(x, y, color, time) {
        const angle = time * 2 + rand(0, Math.PI * 2);
        const r = rand(10, 25);
        this.add(new Particle(
            x + Math.cos(angle) * r, y + Math.sin(angle) * r,
            rand(-5, 5), rand(-5, 5),
            color, rand(1, 2.5), rand(0.3, 0.6), 'float'
        ));
    }

    // 倒流时间粒子
    rewindParticle(x, y) {
        this.add(new Particle(
            x + rand(-50, 50), y + rand(-50, 50),
            rand(-100, 100), rand(20, 80),
            C.rewindTint, rand(1, 3), rand(0.3, 0.7), 'float'
        ));
    }

    // 分数飘字粒子（用特殊类型表示）
    scorePopup(x, y, text, color) {
        this.add(new Particle(x, y, 0, -60, color, 0, 1.2, 'scoreText'));
        this.particles[this.particles.length - 1].text = text;
    }

    update(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update(dt);
            if (this.particles[i].dead) this.particles.splice(i, 1);
        }
    }

    render(ctx) {
        for (const p of this.particles) {
            const a = p.alpha;
            if (p.type === 'scoreText') {
                ctx.save();
                ctx.globalAlpha = a;
                ctx.font = `bold 16px monospace`;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.textAlign = 'center';
                ctx.fillText(p.text, p.x, p.y);
                ctx.restore();
                continue;
            }
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = p.size * 3;
            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(0.5, p.size * a), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }
}

// ==================== 主游戏类 ====================
class NeonSerpent {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.audio = new AudioSystem();
        this.particles = new ParticleSystem();

        // 游戏状态
        this.state = 'MENU'; // MENU / PLAYING / GAMEOVER
        this.isRewinding = false;
        this.timeEnergy = ENERGY_MAX;
        this.score = 0;
        this.highScore = parseInt(localStorage.getItem('neonSerpentHigh') || '0');
        this.combo = 0;
        this.maxCombo = 0;
        this.lastEatTime = 0;
        this.foodEaten = 0;
        this.speed = BASE_SPEED;

        // 蛇的状态
        this.snake = [];
        this.prevSnake = []; // 上一帧位置（用于插值）
        this.direction = { x: 1, y: 0 };
        this.nextDirection = { x: 1, y: 0 };
        this.inputQueue = []; // 输入缓冲队列

        // 食物
        this.food = null;
        this.foodSpawnTime = 0;

        // 时间倒流
        this.stateHistory = [];

        // 渲染相关
        this.shakeAmount = 0;
        this.shakeX = 0;
        this.shakeY = 0;
        this.gridPulse = 0;
        this.tickAccumulator = 0;
        this.interpFactor = 0;
        this.time = 0;
        this.lastTime = 0;
        this.deathTime = 0;
        this.menuSnake = []; // 菜单动画蛇

        // 计时和缓存
        this.cellSize = 0;
        this.offsetX = 0;
        this.offsetY = 0;
        this.hudHeight = 60;

        // 触摸控制
        this.touchStart = null;
        this.touchHoldTimer = null;

        this.resize();
        this.initInput();
        this.initMenuSnake();
    }

    // ---- 初始化 ----
    resize() {
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = window.innerWidth * dpr;
        this.canvas.height = window.innerHeight * dpr;
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        this.width = window.innerWidth;
        this.height = window.innerHeight;

        // 计算网格大小和偏移
        const maxGameSize = Math.min(this.width - 20, this.height - this.hudHeight - 30);
        this.cellSize = Math.floor(maxGameSize / GRID);
        const gridSize = this.cellSize * GRID;
        this.offsetX = Math.floor((this.width - gridSize) / 2);
        this.offsetY = Math.floor((this.height - gridSize) / 2) + this.hudHeight / 2;
    }

    initMenuSnake() {
        // 在菜单界面展示一条自动游走的蛇
        this.menuSnake = [];
        const cx = Math.floor(GRID / 2);
        const cy = Math.floor(GRID / 2);
        for (let i = 0; i < 12; i++) {
            this.menuSnake.push({ x: cx - i, y: cy });
        }
        this.menuDir = { x: 1, y: 0 };
        this.menuTickAcc = 0;
        this.menuTurnTimer = 0;
    }

    initInput() {
        // 键盘控制
        window.addEventListener('keydown', (e) => {
            this.audio.resume();
            if (this.state === 'MENU') {
                if (e.code === 'Space' || e.code === 'Enter') { this.startGame(); e.preventDefault(); }
                return;
            }
            if (this.state === 'GAMEOVER') {
                if (e.code === 'Space' || e.code === 'Enter') { this.startGame(); e.preventDefault(); }
                return;
            }
            if (this.state === 'PLAYING') {
                if (e.code === 'Space') {
                    if (!this.isRewinding && this.timeEnergy > 5) {
                        this.isRewinding = true;
                        this.audio.startRewind();
                    }
                    e.preventDefault();
                    return;
                }
                const dirMap = {
                    'ArrowUp': { x: 0, y: -1 }, 'KeyW': { x: 0, y: -1 },
                    'ArrowDown': { x: 0, y: 1 }, 'KeyS': { x: 0, y: 1 },
                    'ArrowLeft': { x: -1, y: 0 }, 'KeyA': { x: -1, y: 0 },
                    'ArrowRight': { x: 1, y: 0 }, 'KeyD': { x: 1, y: 0 },
                };
                if (dirMap[e.code]) {
                    this.queueDirection(dirMap[e.code]);
                    e.preventDefault();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && this.isRewinding) {
                this.isRewinding = false;
                this.audio.stopRewind();
            }
        });

        // 触摸控制
        this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.audio.resume();
            const touch = e.touches[0];
            this.touchStart = { x: touch.clientX, y: touch.clientY, time: Date.now() };

            // 长按检测（用于倒流）
            this.touchHoldTimer = setTimeout(() => {
                if (this.state === 'PLAYING' && this.touchStart && this.timeEnergy > 5) {
                    this.isRewinding = true;
                    this.audio.startRewind();
                }
            }, 300);

            if (this.state === 'MENU' || this.state === 'GAMEOVER') {
                this.startGame();
            }
        }, { passive: false });

        this.canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!this.touchStart || this.state !== 'PLAYING') return;
            const touch = e.touches[0];
            const dx = touch.clientX - this.touchStart.x;
            const dy = touch.clientY - this.touchStart.y;
            const threshold = 20;
            if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                // 取消长按
                clearTimeout(this.touchHoldTimer);
                if (Math.abs(dx) > Math.abs(dy)) {
                    this.queueDirection(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
                } else {
                    this.queueDirection(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
                }
                this.touchStart = { x: touch.clientX, y: touch.clientY, time: Date.now() };
            }
        }, { passive: false });

        this.canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            clearTimeout(this.touchHoldTimer);
            if (this.isRewinding) {
                this.isRewinding = false;
                this.audio.stopRewind();
            }
            this.touchStart = null;
        }, { passive: false });

        window.addEventListener('resize', () => this.resize());
    }

    // 方向输入缓冲，防止快速连按丢失
    queueDirection(dir) {
        if (this.inputQueue.length < 3) {
            this.inputQueue.push(dir);
        }
    }

    processInputQueue() {
        while (this.inputQueue.length > 0) {
            const dir = this.inputQueue.shift();
            // 禁止180度掉头
            if (dir.x !== -this.direction.x || dir.y !== -this.direction.y) {
                if (dir.x !== this.direction.x || dir.y !== this.direction.y) {
                    this.nextDirection = { ...dir };
                    break; // 每tick只处理一个有效输入
                }
            }
        }
    }

    // ---- 游戏生命周期 ----
    startGame() {
        this.audio.init();
        this.audio.resume();
        this.state = 'PLAYING';
        this.score = 0;
        this.combo = 0;
        this.maxCombo = 0;
        this.lastEatTime = 0;
        this.foodEaten = 0;
        this.speed = BASE_SPEED;
        this.timeEnergy = ENERGY_MAX;
        this.isRewinding = false;
        this.stateHistory = [];
        this.inputQueue = [];
        this.tickAccumulator = 0;

        // 初始化蛇（从中间开始，长度4）
        const cx = Math.floor(GRID / 2);
        const cy = Math.floor(GRID / 2);
        this.snake = [];
        for (let i = 0; i < 4; i++) {
            this.snake.push({ x: cx - i, y: cy });
        }
        this.prevSnake = this.snake.map(s => ({ ...s }));
        this.direction = { x: 1, y: 0 };
        this.nextDirection = { x: 1, y: 0 };

        this.spawnFood();
        this.particles.particles = [];
    }

    gameOver() {
        this.state = 'GAMEOVER';
        this.deathTime = this.time;
        this.audio.stopRewind();
        this.audio.playDeath();

        // 死亡大爆炸
        const head = this.snake[0];
        const px = this.offsetX + head.x * this.cellSize + this.cellSize / 2;
        const py = this.offsetY + head.y * this.cellSize + this.cellSize / 2;
        this.particles.explosion(px, py, 100);
        this.shakeAmount = 15;

        // 更新最高分
        if (this.score > this.highScore) {
            this.highScore = this.score;
            localStorage.setItem('neonSerpentHigh', this.highScore.toString());
        }
    }

    // ---- 食物 ----
    spawnFood() {
        const occupied = new Set(this.snake.map(s => `${s.x},${s.y}`));
        let attempts = 0;
        do {
            this.food = { x: randInt(1, GRID - 2), y: randInt(1, GRID - 2) };
            attempts++;
        } while (occupied.has(`${this.food.x},${this.food.y}`) && attempts < 200);
        this.foodSpawnTime = this.time;
    }

    // ---- 时间倒流 ----
    saveState() {
        const snapshot = {
            snake: this.snake.map(s => ({ ...s })),
            food: this.food ? { ...this.food } : null,
            score: this.score,
            direction: { ...this.direction },
            foodEaten: this.foodEaten,
            speed: this.speed,
            combo: this.combo,
        };
        this.stateHistory.push(snapshot);
        if (this.stateHistory.length > MAX_HISTORY) {
            this.stateHistory.shift();
        }
    }

    rewindTick() {
        if (this.stateHistory.length === 0) {
            this.isRewinding = false;
            this.audio.stopRewind();
            return;
        }

        // 每帧倒退2个状态（2倍速倒流）
        for (let i = 0; i < 2 && this.stateHistory.length > 0; i++) {
            const snapshot = this.stateHistory.pop();
            this.snake = snapshot.snake;
            this.prevSnake = this.snake.map(s => ({ ...s }));
            this.food = snapshot.food;
            this.score = snapshot.score;
            this.direction = snapshot.direction;
            this.nextDirection = { ...this.direction };
            this.foodEaten = snapshot.foodEaten;
            this.speed = snapshot.speed;
            this.combo = snapshot.combo;
        }

        this.timeEnergy -= REWIND_DRAIN;
        if (this.timeEnergy <= 0) {
            this.timeEnergy = 0;
            this.isRewinding = false;
            this.audio.stopRewind();
        }

        // 倒流粒子效果
        const head = this.snake[0];
        const px = this.offsetX + head.x * this.cellSize + this.cellSize / 2;
        const py = this.offsetY + head.y * this.cellSize + this.cellSize / 2;
        this.particles.rewindParticle(px, py);
    }

    // ---- 游戏逻辑 tick ----
    tick() {
        this.processInputQueue();
        this.direction = { ...this.nextDirection };

        // 保存当前状态用于倒流
        this.saveState();

        // 保存上一帧位置（用于渲染插值）
        this.prevSnake = this.snake.map(s => ({ ...s }));

        // 计算新蛇头位置
        const head = this.snake[0];
        const newHead = {
            x: head.x + this.direction.x,
            y: head.y + this.direction.y,
        };

        // 墙壁碰撞检测
        if (newHead.x < 0 || newHead.x >= GRID || newHead.y < 0 || newHead.y >= GRID) {
            this.gameOver();
            return;
        }

        // 自身碰撞检测（跳过尾巴最后一节，因为它即将移走）
        for (let i = 0; i < this.snake.length - 1; i++) {
            if (this.snake[i].x === newHead.x && this.snake[i].y === newHead.y) {
                this.gameOver();
                return;
            }
        }

        // 移动蛇
        this.snake.unshift(newHead);

        // 吃食物检测
        if (this.food && newHead.x === this.food.x && newHead.y === this.food.y) {
            this.eatFood();
        } else {
            this.snake.pop(); // 没吃到就去掉尾巴
        }
    }

    eatFood() {
        const now = Date.now();
        const foodPx = this.offsetX + this.food.x * this.cellSize + this.cellSize / 2;
        const foodPy = this.offsetY + this.food.y * this.cellSize + this.cellSize / 2;

        // 连击判定
        if (now - this.lastEatTime < COMBO_TIMEOUT) {
            this.combo = Math.min(this.combo + 1, 5);
        } else {
            this.combo = 0;
        }
        this.lastEatTime = now;
        if (this.combo > this.maxCombo) this.maxCombo = this.combo;

        // 计分
        const points = 10 * (this.combo + 1);
        this.score += points;
        this.foodEaten++;

        // 粒子和音效
        this.particles.burst(foodPx, foodPy, C.foodCore, 25);
        this.particles.scorePopup(foodPx, foodPy - 10, `+${points}`, this.combo > 0 ? C.comboGlow : C.foodGlow);
        this.audio.playEat(1 + this.combo * 0.1);
        if (this.combo > 0) this.audio.playCombo(this.combo);

        // 屏幕震动
        this.shakeAmount = Math.min(3 + this.combo, 8);
        this.gridPulse = 0.4;

        // 加速
        if (this.foodEaten % 5 === 0) {
            this.speed = Math.min(MAX_SPEED, this.speed + SPEED_INC);
        }

        // 生成新食物
        this.spawnFood();
    }

    // ---- 更新循环 ----
    update(dt) {
        this.time += dt;

        if (this.state === 'MENU') {
            this.updateMenuSnake(dt);
            this.particles.update(dt);
            return;
        }

        if (this.state === 'GAMEOVER') {
            this.particles.update(dt);
            this.shakeAmount *= 0.93;
            return;
        }

        // PLAYING 状态
        if (this.isRewinding) {
            this.rewindTick();
        } else {
            this.tickAccumulator += dt;
            const tickInterval = 1 / this.speed;
            let ticksThisFrame = 0;
            while (this.tickAccumulator >= tickInterval && ticksThisFrame < 3) {
                this.tickAccumulator -= tickInterval;
                this.tick();
                ticksThisFrame++;
                if (this.state !== 'PLAYING') return; // 可能在tick中死亡
            }
            this.interpFactor = clamp(this.tickAccumulator / tickInterval, 0, 1);

            // 回复时间能量
            this.timeEnergy = Math.min(ENERGY_MAX, this.timeEnergy + ENERGY_REGEN);
        }

        // 蛇尾拖尾粒子
        if (this.snake.length > 1 && Math.random() < 0.5) {
            const tail = this.snake[this.snake.length - 1];
            const px = this.offsetX + tail.x * this.cellSize + this.cellSize / 2;
            const py = this.offsetY + tail.y * this.cellSize + this.cellSize / 2;
            const t = 1;
            this.particles.trail(px, py, lerpColor(C.bodyStart, C.bodyEnd, t));
        }

        // 食物光环粒子
        if (this.food && Math.random() < 0.3) {
            const fx = this.offsetX + this.food.x * this.cellSize + this.cellSize / 2;
            const fy = this.offsetY + this.food.y * this.cellSize + this.cellSize / 2;
            this.particles.foodHalo(fx, fy, C.foodGlow, this.time);
        }

        this.particles.update(dt);

        // 屏幕震动衰减
        this.shakeAmount *= 0.9;
        if (this.shakeAmount < 0.1) this.shakeAmount = 0;
        this.gridPulse *= 0.92;
        if (this.gridPulse < 0.01) this.gridPulse = 0;
        this.shakeX = (Math.random() - 0.5) * this.shakeAmount * 2;
        this.shakeY = (Math.random() - 0.5) * this.shakeAmount * 2;
    }

    // 菜单动画蛇的简单AI
    updateMenuSnake(dt) {
        this.menuTickAcc += dt;
        this.menuTurnTimer -= dt;
        if (this.menuTickAcc < 0.1) return;
        this.menuTickAcc = 0;

        // 随机转向
        if (this.menuTurnTimer <= 0) {
            this.menuTurnTimer = rand(0.3, 1.5);
            const dirs = [
                { x: 1, y: 0 }, { x: -1, y: 0 },
                { x: 0, y: 1 }, { x: 0, y: -1 }
            ].filter(d => d.x !== -this.menuDir.x || d.y !== -this.menuDir.y);
            this.menuDir = dirs[randInt(0, dirs.length - 1)];
        }

        const head = this.menuSnake[0];
        let nx = head.x + this.menuDir.x;
        let ny = head.y + this.menuDir.y;

        // 碰墙反弹
        if (nx < 2 || nx >= GRID - 2 || ny < 2 || ny >= GRID - 2) {
            const dirs = [
                { x: 1, y: 0 }, { x: -1, y: 0 },
                { x: 0, y: 1 }, { x: 0, y: -1 }
            ].filter(d => d.x !== -this.menuDir.x || d.y !== -this.menuDir.y);
            this.menuDir = dirs[randInt(0, dirs.length - 1)];
            nx = head.x + this.menuDir.x;
            ny = head.y + this.menuDir.y;
        }

        this.menuSnake.unshift({ x: nx, y: ny });
        if (this.menuSnake.length > 15) this.menuSnake.pop();

        // 菜单蛇拖尾
        if (Math.random() < 0.3) {
            const tail = this.menuSnake[this.menuSnake.length - 1];
            const px = this.offsetX + tail.x * this.cellSize + this.cellSize / 2;
            const py = this.offsetY + tail.y * this.cellSize + this.cellSize / 2;
            this.particles.trail(px, py, C.headGlow);
        }

        this.particles.update(dt);
    }

    // ---- 渲染 ----
    render() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        // 清空画布
        ctx.fillStyle = C.bg;
        ctx.fillRect(0, 0, w, h);

        if (this.state === 'MENU') {
            this.renderMenu(ctx, w, h);
            return;
        }

        // 应用屏幕震动
        ctx.save();
        ctx.translate(this.shakeX, this.shakeY);

        // 绘制网格
        this.renderGrid(ctx);

        // 绘制食物
        if (this.food) this.renderFood(ctx);

        // 绘制蛇
        this.renderSnake(ctx);

        // 绘制粒子
        this.particles.render(ctx);

        ctx.restore();

        // 边缘暗角（vignette）效果
        this.renderVignette(ctx, w, h);

        // HUD（不受震动影响）
        this.renderHUD(ctx, w, h);

        // 倒流视觉效果
        if (this.isRewinding) {
            this.renderRewindEffect(ctx, w, h);
        }

        // 死亡闪光
        if (this.state === 'GAMEOVER' && this.time - this.deathTime < 0.3) {
            const flashAlpha = (0.3 - (this.time - this.deathTime)) / 0.3 * 0.3;
            ctx.fillStyle = `rgba(255, 0, 68, ${flashAlpha})`;
            ctx.fillRect(0, 0, w, h);
        }

        // 游戏结束界面
        if (this.state === 'GAMEOVER') {
            this.renderGameOver(ctx, w, h);
        }
    }

    renderVignette(ctx, w, h) {
        const cx = w / 2, cy = h / 2;
        const r = Math.max(w, h) * 0.7;
        const grad = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.5)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
    }

    renderGrid(ctx) {
        const cs = this.cellSize;
        const gridSize = cs * GRID;

        // 网格背景
        ctx.fillStyle = '#08081a';
        ctx.fillRect(this.offsetX, this.offsetY, gridSize, gridSize);

        // 网格线（吃食物时短暂变亮）
        const gridAlpha = 0.3 + this.gridPulse * 0.5;
        ctx.strokeStyle = `rgba(15, 15, 40, ${gridAlpha})`;
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= GRID; i++) {
            const x = this.offsetX + i * cs;
            const y = this.offsetY + i * cs;
            ctx.beginPath();
            ctx.moveTo(x, this.offsetY);
            ctx.lineTo(x, this.offsetY + gridSize);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(this.offsetX, y);
            ctx.lineTo(this.offsetX + gridSize, y);
            ctx.stroke();
        }

        // 边框发光（吃食物时增强）
        const borderAlpha = 0.3 + this.gridPulse * 0.7;
        const borderGlow = 10 + this.gridPulse * 20;
        ctx.strokeStyle = hexToRgba(C.headGlow, borderAlpha);
        ctx.lineWidth = 2;
        ctx.shadowColor = C.headGlow;
        ctx.shadowBlur = borderGlow;
        ctx.strokeRect(this.offsetX, this.offsetY, gridSize, gridSize);
        ctx.shadowBlur = 0;
    }

    renderFood(ctx) {
        const cs = this.cellSize;
        const fx = this.offsetX + this.food.x * cs + cs / 2;
        const fy = this.offsetY + this.food.y * cs + cs / 2;
        const pulse = 1 + Math.sin(this.time * 4) * 0.15;
        const baseR = cs * 0.35 * pulse;

        // 外圈光晕
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowColor = C.foodGlow;
        ctx.shadowBlur = 20;
        ctx.fillStyle = hexToRgba(C.foodGlow, 0.15);
        ctx.beginPath();
        ctx.arc(fx, fy, baseR * 2.5, 0, Math.PI * 2);
        ctx.fill();

        // 内圈
        ctx.shadowBlur = 12;
        ctx.fillStyle = hexToRgba(C.foodCore, 0.6);
        ctx.beginPath();
        ctx.arc(fx, fy, baseR * 1.3, 0, Math.PI * 2);
        ctx.fill();

        // 核心
        ctx.shadowBlur = 8;
        ctx.fillStyle = C.foodCore;
        ctx.beginPath();
        ctx.arc(fx, fy, baseR, 0, Math.PI * 2);
        ctx.fill();

        // 白色亮点
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(fx - baseR * 0.2, fy - baseR * 0.2, baseR * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    renderSnake(ctx) {
        const cs = this.cellSize;
        const len = this.snake.length;

        // 从尾到头绘制（头在最上层）
        for (let i = len - 1; i >= 0; i--) {
            const curr = this.snake[i];
            const prev = i < this.prevSnake.length ? this.prevSnake[i] : curr;

            // 插值位置
            const t = this.state === 'PLAYING' && !this.isRewinding ? this.interpFactor : 0;
            const px = this.offsetX + lerp(prev.x, curr.x, t) * cs + cs / 2;
            const py = this.offsetY + lerp(prev.y, curr.y, t) * cs + cs / 2;

            const ratio = i / Math.max(1, len - 1); // 0=头, 1=尾
            const segSize = cs * lerp(0.42, 0.28, ratio);
            const bodyColor = lerpColor(C.bodyStart, C.bodyEnd, ratio);

            ctx.save();

            if (i === 0) {
                // ---- 蛇头 ----
                // 大范围光晕
                ctx.globalCompositeOperation = 'lighter';
                ctx.shadowColor = C.headGlow;
                ctx.shadowBlur = 20;
                ctx.fillStyle = hexToRgba(C.headGlow, 0.2);
                ctx.beginPath();
                ctx.arc(px, py, segSize * 2, 0, Math.PI * 2);
                ctx.fill();

                // 主体
                ctx.shadowBlur = 12;
                ctx.fillStyle = C.headGlow;
                ctx.beginPath();
                ctx.arc(px, py, segSize, 0, Math.PI * 2);
                ctx.fill();

                // 白色核心
                ctx.shadowBlur = 0;
                ctx.fillStyle = C.headCore;
                ctx.beginPath();
                ctx.arc(px, py, segSize * 0.55, 0, Math.PI * 2);
                ctx.fill();

                // 眼睛
                const eyeOff = segSize * 0.3;
                const eyeR = segSize * 0.15;
                const perpX = -this.direction.y;
                const perpY = this.direction.x;
                // 左眼
                ctx.fillStyle = '#001122';
                ctx.beginPath();
                ctx.arc(px + this.direction.x * eyeOff * 0.5 + perpX * eyeOff, py + this.direction.y * eyeOff * 0.5 + perpY * eyeOff, eyeR, 0, Math.PI * 2);
                ctx.fill();
                // 右眼
                ctx.beginPath();
                ctx.arc(px + this.direction.x * eyeOff * 0.5 - perpX * eyeOff, py + this.direction.y * eyeOff * 0.5 - perpY * eyeOff, eyeR, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // ---- 蛇身 ----
                ctx.globalCompositeOperation = 'lighter';

                // 光晕
                ctx.shadowColor = bodyColor;
                ctx.shadowBlur = 8;
                ctx.fillStyle = hexToRgba(bodyColor, 0.15);
                ctx.beginPath();
                ctx.arc(px, py, segSize * 1.8, 0, Math.PI * 2);
                ctx.fill();

                // 主体
                ctx.shadowBlur = 5;
                ctx.fillStyle = bodyColor;
                ctx.beginPath();
                ctx.arc(px, py, segSize, 0, Math.PI * 2);
                ctx.fill();

                // 亮核
                ctx.shadowBlur = 0;
                ctx.fillStyle = hexToRgba('#ffffff', 0.3);
                ctx.beginPath();
                ctx.arc(px, py, segSize * 0.35, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // 连接线（让蛇身连贯）
        if (len > 1) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineWidth = cs * 0.2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            for (let i = 0; i < len - 1; i++) {
                const curr = this.snake[i];
                const prev = i < this.prevSnake.length ? this.prevSnake[i] : curr;
                const next = this.snake[i + 1];
                const nextPrev = (i + 1) < this.prevSnake.length ? this.prevSnake[i + 1] : next;

                const t = this.state === 'PLAYING' && !this.isRewinding ? this.interpFactor : 0;
                const x1 = this.offsetX + lerp(prev.x, curr.x, t) * cs + cs / 2;
                const y1 = this.offsetY + lerp(prev.y, curr.y, t) * cs + cs / 2;
                const x2 = this.offsetX + lerp(nextPrev.x, next.x, t) * cs + cs / 2;
                const y2 = this.offsetY + lerp(nextPrev.y, next.y, t) * cs + cs / 2;

                const ratio = i / Math.max(1, len - 1);
                ctx.strokeStyle = lerpColor(C.bodyStart, C.bodyEnd, ratio);
                ctx.shadowColor = ctx.strokeStyle;
                ctx.shadowBlur = 6;
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            ctx.restore();
        }
    }

    renderHUD(ctx, w, h) {
        const hudY = 10;
        const hudH = 40;

        // 半透明HUD背景
        ctx.fillStyle = 'rgba(5, 5, 16, 0.7)';
        ctx.fillRect(0, 0, w, hudH + hudY + 10);

        // 分数
        ctx.save();
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.fillStyle = C.scoreGlow;
        ctx.shadowColor = C.scoreGlow;
        ctx.shadowBlur = 10;
        ctx.textAlign = 'left';
        ctx.fillText(`${this.score}`, 20, hudY + 30);

        // "SCORE" 标签
        ctx.font = '11px "Courier New", monospace';
        ctx.fillStyle = hexToRgba(C.scoreGlow, 0.6);
        ctx.shadowBlur = 0;
        ctx.fillText('SCORE', 20, hudY + 12);
        ctx.restore();

        // 连击
        if (this.combo > 0 && Date.now() - this.lastEatTime < COMBO_TIMEOUT + 500) {
            ctx.save();
            const comboScale = 1 + Math.sin(this.time * 8) * 0.1;
            const comboAlpha = this.combo > 0 ? 1 : clamp(1 - (Date.now() - this.lastEatTime - COMBO_TIMEOUT) / 500, 0, 1);
            ctx.globalAlpha = comboAlpha;
            ctx.font = `bold ${Math.round(22 * comboScale)}px "Courier New", monospace`;
            ctx.fillStyle = C.comboGlow;
            ctx.shadowColor = C.comboGlow;
            ctx.shadowBlur = 12;
            ctx.textAlign = 'center';
            ctx.fillText(`${this.combo + 1}x COMBO`, w / 2, hudY + 30);
            ctx.restore();
        }

        // 时间能量条
        const barW = 140;
        const barH = 14;
        const barX = w - barW - 20;
        const barY = hudY + 18;

        // 能量条背景
        ctx.fillStyle = C.energyBg;
        ctx.fillRect(barX, barY, barW, barH);

        // 能量条填充
        const energyRatio = this.timeEnergy / ENERGY_MAX;
        const energyGrad = ctx.createLinearGradient(barX, 0, barX + barW * energyRatio, 0);
        energyGrad.addColorStop(0, C.energyBar);
        energyGrad.addColorStop(1, '#ff44cc');
        ctx.fillStyle = energyGrad;
        ctx.shadowColor = C.energyBar;
        ctx.shadowBlur = energyRatio > 0.3 ? 6 : 2;
        ctx.fillRect(barX, barY, barW * energyRatio, barH);
        ctx.shadowBlur = 0;

        // 能量条边框
        ctx.strokeStyle = hexToRgba(C.energyBar, 0.5);
        ctx.lineWidth = 1;
        ctx.strokeRect(barX, barY, barW, barH);

        // "TIME" 标签
        ctx.font = '10px "Courier New", monospace';
        ctx.fillStyle = hexToRgba(C.energyBar, 0.7);
        ctx.textAlign = 'right';
        ctx.fillText('TIME ENERGY', barX + barW, barY - 3);

        // 蛇长度
        ctx.font = '10px "Courier New", monospace';
        ctx.fillStyle = hexToRgba('#8888aa', 0.8);
        ctx.textAlign = 'right';
        ctx.fillText(`LEN ${this.snake.length}`, w - 20, hudY + 50);

        // 速度指示
        ctx.textAlign = 'left';
        ctx.fillText(`SPD ${this.speed.toFixed(1)}`, 20, hudY + 50);
    }

    renderRewindEffect(ctx, w, h) {
        // 全屏橙色调色
        ctx.fillStyle = C.rewindOverlay;
        ctx.fillRect(0, 0, w, h);

        // VHS 扫描线效果
        ctx.save();
        ctx.globalAlpha = 0.06;
        for (let y = 0; y < h; y += 3) {
            if (Math.random() < 0.5) {
                ctx.fillStyle = C.rewindTint;
                ctx.fillRect(0, y, w, 1);
            }
        }

        // 随机水平干扰线
        ctx.globalAlpha = 0.15;
        for (let i = 0; i < 3; i++) {
            const y = rand(0, h);
            ctx.fillStyle = C.rewindTint;
            ctx.fillRect(0, y, w, rand(1, 3));
        }
        ctx.restore();

        // "REWIND" 提示
        ctx.save();
        const rewindAlpha = 0.5 + Math.sin(this.time * 6) * 0.3;
        ctx.globalAlpha = rewindAlpha;
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.fillStyle = C.rewindTint;
        ctx.shadowColor = C.rewindTint;
        ctx.shadowBlur = 10;
        ctx.textAlign = 'center';
        ctx.fillText('◄◄ REWIND ◄◄', w / 2, this.offsetY + this.cellSize * GRID + 25);
        ctx.restore();
    }

    renderMenu(ctx, w, h) {
        // 背景
        ctx.fillStyle = C.bg;
        ctx.fillRect(0, 0, w, h);

        // 绘制菜单蛇
        const cs = this.cellSize;
        for (let i = this.menuSnake.length - 1; i >= 0; i--) {
            const seg = this.menuSnake[i];
            const px = this.offsetX + seg.x * cs + cs / 2;
            const py = this.offsetY + seg.y * cs + cs / 2;
            const ratio = i / Math.max(1, this.menuSnake.length - 1);
            const size = cs * lerp(0.35, 0.2, ratio);
            const alpha = lerp(1, 0.3, ratio);
            const color = lerpColor(C.bodyStart, C.bodyEnd, ratio);

            ctx.save();
            ctx.globalAlpha = alpha * 0.4;
            ctx.globalCompositeOperation = 'lighter';
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(px, py, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        this.particles.render(ctx);

        // 标题
        const titleY = h * 0.28;
        const titlePulse = 1 + Math.sin(this.time * 2) * 0.03;

        ctx.save();
        ctx.textAlign = 'center';

        // 标题光晕层
        ctx.globalCompositeOperation = 'lighter';
        ctx.font = `bold ${Math.round(64 * titlePulse)}px "Courier New", monospace`;
        ctx.fillStyle = hexToRgba(C.headGlow, 0.15);
        ctx.shadowColor = C.headGlow;
        ctx.shadowBlur = 40;
        ctx.fillText('NEON', w / 2, titleY);
        ctx.fillText('SERPENT', w / 2, titleY + 60);

        // 标题主体
        ctx.shadowBlur = 15;
        ctx.fillStyle = C.headGlow;
        ctx.fillText('NEON', w / 2, titleY);
        ctx.fillStyle = C.foodGlow;
        ctx.fillText('SERPENT', w / 2, titleY + 60);

        // 副标题
        ctx.shadowBlur = 5;
        ctx.font = '18px "Courier New", monospace';
        ctx.fillStyle = hexToRgba(C.comboGlow, 0.8);
        ctx.shadowColor = C.comboGlow;
        ctx.fillText('时 间 在 你 手 中', w / 2, titleY + 100);
        ctx.restore();

        // 操作说明
        const instrY = h * 0.62;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = '14px "Courier New", monospace';
        ctx.fillStyle = hexToRgba('#8888cc', 0.9);
        ctx.shadowBlur = 0;
        ctx.fillText('方向键 / WASD — 控制方向', w / 2, instrY);
        ctx.fillText('按住 SPACE — 时间倒流', w / 2, instrY + 24);
        ctx.fillText('触屏：滑动转向 / 长按倒流', w / 2, instrY + 48);
        ctx.restore();

        // 开始提示（闪烁）
        const startAlpha = 0.5 + Math.sin(this.time * 3) * 0.4;
        ctx.save();
        ctx.globalAlpha = startAlpha;
        ctx.textAlign = 'center';
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillStyle = C.headCore;
        ctx.shadowColor = C.headGlow;
        ctx.shadowBlur = 15;
        ctx.fillText('按 SPACE 或 点击屏幕 开始', w / 2, h * 0.80);
        ctx.restore();

        // 最高分
        if (this.highScore > 0) {
            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = '13px "Courier New", monospace';
            ctx.fillStyle = hexToRgba(C.foodGlow, 0.7);
            ctx.fillText(`BEST: ${this.highScore}`, w / 2, h * 0.87);
            ctx.restore();
        }
    }

    renderGameOver(ctx, w, h) {
        // 半透明遮罩
        ctx.fillStyle = 'rgba(5, 5, 16, 0.75)';
        ctx.fillRect(0, 0, w, h);

        const centerY = h * 0.35;

        ctx.save();
        ctx.textAlign = 'center';

        // 标题
        ctx.font = 'bold 48px "Courier New", monospace';
        ctx.fillStyle = C.deathFlash;
        ctx.shadowColor = C.deathFlash;
        ctx.shadowBlur = 20;
        ctx.fillText('VOID COLLAPSE', w / 2, centerY);

        // 分数
        ctx.shadowBlur = 8;
        ctx.shadowColor = C.scoreGlow;
        ctx.font = 'bold 36px "Courier New", monospace';
        ctx.fillStyle = C.scoreGlow;
        ctx.fillText(`${this.score}`, w / 2, centerY + 60);

        ctx.font = '13px "Courier New", monospace';
        ctx.fillStyle = hexToRgba(C.scoreGlow, 0.6);
        ctx.shadowBlur = 0;
        ctx.fillText('SCORE', w / 2, centerY + 78);

        // 统计信息
        ctx.font = '14px "Courier New", monospace';
        ctx.fillStyle = hexToRgba('#8888cc', 0.8);
        ctx.fillText(`长度 ${this.snake.length}  |  最高连击 ${this.maxCombo + 1}x  |  速度 ${this.speed.toFixed(1)}`, w / 2, centerY + 110);

        // 最高分
        if (this.score >= this.highScore && this.score > 0) {
            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.fillStyle = C.foodCore;
            ctx.shadowColor = C.foodGlow;
            ctx.shadowBlur = 10;
            ctx.fillText('★ NEW BEST ★', w / 2, centerY + 145);
        } else {
            ctx.font = '13px "Courier New", monospace';
            ctx.fillStyle = hexToRgba(C.foodGlow, 0.6);
            ctx.shadowBlur = 0;
            ctx.fillText(`BEST: ${this.highScore}`, w / 2, centerY + 145);
        }

        // 重新开始提示
        const restartAlpha = 0.5 + Math.sin(this.time * 3) * 0.4;
        ctx.globalAlpha = restartAlpha;
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.fillStyle = C.headCore;
        ctx.shadowColor = C.headGlow;
        ctx.shadowBlur = 10;
        ctx.fillText('按 SPACE 或 点击屏幕 重新开始', w / 2, centerY + 200);

        ctx.restore();
    }

    // ---- 主循环 ----
    run() {
        const loop = (timestamp) => {
            if (!this.lastTime) this.lastTime = timestamp;
            const dt = Math.min((timestamp - this.lastTime) / 1000, 0.05); // 限制最大dt防止跳帧
            this.lastTime = timestamp;
            this.update(dt);
            this.render();
            requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
    }
}

// ==================== 启动游戏 ====================
const canvas = document.getElementById('c');
const game = new NeonSerpent(canvas);
game.run();
</script>
