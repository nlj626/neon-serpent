<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON SERPENT - 霓虹蛇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #050510;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ==================== 配置常量 ====================
const WORLD = 50;                  // 世界网格 50x50（4倍面积）
const BASE_SPEED = 11;             // 初始速度（格/秒）
const MAX_SPEED = 22;
const SPEED_INC = 0.3;
const MAX_HISTORY = 400;
const REWIND_DRAIN = 1.0;
const ENERGY_MAX = 100;
const ENERGY_REGEN = 0.10;
const COMBO_TIMEOUT = 2200;
const PARTICLE_LIMIT = 500;
const FOOD_TARGET = 12;            // 场上目标食物数量
const FOOD_MIN = 7;                // 低于此数量刷新食物
const AI_COUNT = 3;
const AI_RESPAWN_TIME = 12;        // AI重生时间（秒）
const AI_DEATH_FOOD_RATE = 0.4;    // AI死亡身体转化食物概率
const VIEW_CELLS = 26;             // 视口可见格子数

// 颜色
const C = {
    bg: '#0a0a1a', gridLine: '#0e0e22', headCore: '#ffffff',
    headGlow: '#00ffff', bodyStart: '#00ffff', bodyEnd: '#6600cc',
    foodCore: '#ffff44', foodGlow: '#ffaa00',
    energyBar: '#ff00aa', energyBg: '#330033',
    scoreGlow: '#00ffff', comboGlow: '#ff00ff',
    rewindTint: '#ff6600', deathFlash: '#ff0044',
    aiColors: [
        { head: '#ff00ff', bodyEnd: '#880088', name: 'VOID-A' },
        { head: '#00ff88', bodyEnd: '#006633', name: 'VOID-B' },
        { head: '#ff8800', bodyEnd: '#884400', name: 'VOID-C' },
    ],
    joyBase: 'rgba(20, 20, 50, 0.6)',
    joyBorder: 'rgba(0, 255, 255, 0.4)',
    joyThumb: '#00ffff',
    rewindBtn: '#ff00aa',
};

// ==================== 工具函数 ====================
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rand = (a, b) => Math.random() * (b - a) + a;
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const hexRgba = (hex, a) => {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
};
const lerpColor = (c1, c2, t) => {
    const r1=parseInt(c1.slice(1,3),16),g1=parseInt(c1.slice(3,5),16),b1=parseInt(c1.slice(5,7),16);
    const r2=parseInt(c2.slice(1,3),16),g2=parseInt(c2.slice(3,5),16),b2=parseInt(c2.slice(5,7),16);
    return `rgb(${Math.round(lerp(r1,r2,t))},${Math.round(lerp(g1,g2,t))},${Math.round(lerp(b1,b2,t))})`;
};

// ==================== 音频系统 ====================
class Audio {
    constructor() { this.ctx = null; this.on = true; }
    init() { try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ this.on=false; } }
    resume() { if(this.ctx?.state==='suspended') this.ctx.resume(); }
    _tone(type,f1,f2,dur,vol=0.12){
        if(!this.on||!this.ctx)return; const t=this.ctx.currentTime;
        const o=this.ctx.createOscillator(),g=this.ctx.createGain();
        o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur*0.7);
        g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
        o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+dur);
    }
    eat(p=1){ this._tone('sine',400*p,900*p,0.1,0.1); }
    combo(lv){ this._tone('triangle',600*(1+lv*.15),1300*(1+lv*.15),0.08,0.08); }
    kill(){ this._tone('square',200,80,0.2,0.08); }
    death(){
        if(!this.on||!this.ctx)return; const t=this.ctx.currentTime;
        const n=this.ctx.sampleRate*0.35,buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=buf.getChannelData(0);
        for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*.4;
        const s=this.ctx.createBufferSource(); s.buffer=buf;
        const f=this.ctx.createBiquadFilter(); f.type='lowpass';
        f.frequency.setValueAtTime(3000,t); f.frequency.exponentialRampToValueAtTime(80,t+0.3);
        const g=this.ctx.createGain(); g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.35);
        s.connect(f).connect(g).connect(this.ctx.destination); s.start(t); s.stop(t+.35);
    }
    startRewind(){
        if(!this.on||!this.ctx)return;
        this._rwOsc=this.ctx.createOscillator(); this._rwGain=this.ctx.createGain();
        const lfo=this.ctx.createOscillator(),lg=this.ctx.createGain();
        this._rwOsc.type='sawtooth'; this._rwOsc.frequency.value=55;
        lfo.type='sine'; lfo.frequency.value=3; lg.gain.value=12;
        lfo.connect(lg).connect(this._rwOsc.frequency);
        this._rwGain.gain.value=0; this._rwGain.gain.linearRampToValueAtTime(.06,this.ctx.currentTime+.1);
        this._rwOsc.connect(this._rwGain).connect(this.ctx.destination);
        this._rwOsc.start(); lfo.start(); this._rwLfo=lfo;
    }
    stopRewind(){
        if(!this._rwOsc)return; try{
            this._rwGain.gain.linearRampToValueAtTime(0,this.ctx.currentTime+.1);
            setTimeout(()=>{try{this._rwOsc.stop();this._rwLfo.stop();}catch(e){}},150);
        }catch(e){} this._rwOsc=null;
    }
}

// ==================== 粒子系统 ====================
class Particle {
    constructor(x,y,vx,vy,color,size,life,type='normal'){
        this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;
        this.size=Math.max(.5,size);this.maxLife=life;this.life=life;this.type=type;
    }
    update(dt){this.life-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;
        if(this.type==='float'){this.vy-=15*dt;this.vx*=.98;}
        else if(this.type==='spark'){this.vx*=.95;this.vy*=.95;}
    }
    get a(){return clamp(this.life/this.maxLife,0,1);}
    get dead(){return this.life<=0;}
}
class Particles {
    constructor(){this.p=[];}
    add(p){if(this.p.length<PARTICLE_LIMIT)this.p.push(p);}
    burst(x,y,color,n=18){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(50,180);
        this.add(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,color,rand(2,4.5),rand(.25,.7),'spark'));}}
    explosion(x,y,n=60){const cols=[C.headGlow,C.foodGlow,C.comboGlow,'#ff0044','#fff'];
        for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(30,250);
        this.add(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,cols[randInt(0,4)],rand(2,6),rand(.4,1.2),'spark'));}}
    trail(x,y,color){this.add(new Particle(x+rand(-3,3),y+rand(-3,3),rand(-10,10),rand(-10,10),color,rand(1,3),rand(.15,.4),'float'));}
    scorePopup(x,y,text,color){const p=new Particle(x,y,0,-55,color,0,1,'scoreText');p.text=text;this.add(p);}
    update(dt){for(let i=this.p.length-1;i>=0;i--){this.p[i].update(dt);if(this.p[i].dead)this.p.splice(i,1);}}
    render(ctx){for(const p of this.p){ctx.save();ctx.globalAlpha=p.a;
        if(p.type==='scoreText'){ctx.font='bold 14px monospace';ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=6;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);}
        else{ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=p.size*2.5;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.5,p.size*p.a),0,Math.PI*2);ctx.fill();}
        ctx.restore();}}
}

// ==================== 主游戏 ====================
class Game {
    constructor(canvas){
        this.cv=canvas; this.ctx=canvas.getContext('2d');
        this.audio=new Audio(); this.particles=new Particles();
        this.isTouch='ontouchstart' in window;
        this.state='MENU';
        this.isRewinding=false; this.timeEnergy=ENERGY_MAX;
        this.score=0; this.highScore=parseInt(localStorage.getItem('neonSerpentHigh')||'0');
        this.combo=0; this.maxCombo=0; this.lastEatTime=0;
        this.foodEaten=0; this.kills=0; this.speed=BASE_SPEED;
        this.player=null; this.aiSnakes=[]; this.aiRespawnTimers=[];
        this.foods=[]; this.stateHistory=[];
        this.camX=0;this.camY=0;this.camTargetX=0;this.camTargetY=0;
        this.cellSize=0;this.shakeAmt=0;this.shakeX=0;this.shakeY=0;this.gridPulse=0;
        this.interpFactor=0;this.tickAcc=0;this.time=0;this.lastTime=0;this.deathTime=0;
        this.visualDir={x:1,y:0};
        this.joyActive=false;this.joyX=0;this.joyY=0;this.joyTouchId=null;
        this.rewindTouchId=null;this.inputQueue=[];
        this.menuSnake=[];this.menuDir={x:1,y:0};this.menuAcc=0;this.menuTurnT=0;
        this.resize(); this.initInput(); this.initMenuSnake();
    }

    resize(){
        const dpr=window.devicePixelRatio||1;
        this.cv.width=window.innerWidth*dpr; this.cv.height=window.innerHeight*dpr;
        this.ctx.setTransform(dpr,0,0,dpr,0,0);
        this.W=window.innerWidth; this.H=window.innerHeight;
        this.hudH=50;
        this.joyAreaH=this.isTouch?170:0;
        this.gameTop=this.hudH;
        this.gameBot=this.H-this.joyAreaH;
        this.gameH=this.gameBot-this.gameTop;
        this.gameW=this.W;
        this.cellSize=Math.max(8,Math.floor(Math.min(this.gameW,this.gameH)/VIEW_CELLS));
    }

    // 世界坐标 → 屏幕坐标
    w2s(wx,wy){
        return {x:(wx-this.camX)*this.cellSize+this.gameW/2,
                y:(wy-this.camY)*this.cellSize+this.gameH/2+this.gameTop};
    }
    isVisible(wx,wy){
        const s=this.w2s(wx,wy),m=this.cellSize*2;
        return s.x>-m&&s.x<this.gameW+m&&s.y>this.gameTop-m&&s.y<this.gameBot+m;
    }

    // 创建蛇数据
    makeSnake(sx,sy,len,dir,colorIdx=-1){
        const body=[];
        for(let i=0;i<len;i++) body.push({x:sx-dir.x*i,y:sy-dir.y*i});
        return {body,prevBody:body.map(p=>({...p})),dir:{...dir},nextDir:{...dir},
                alive:true,colorIdx,speed:BASE_SPEED,tickAcc:0,foodEaten:0,growPending:0};
    }

    // ---- 食物 ----
    spawnFood(){
        const occ=new Set();
        const addOcc=(sn)=>sn.body.forEach(p=>occ.add(`${p.x},${p.y}`));
        if(this.player)addOcc(this.player);
        this.aiSnakes.forEach(a=>{if(a.alive)addOcc(a);});
        this.foods.forEach(f=>occ.add(`${f.x},${f.y}`));
        let tries=0;
        while(tries<200){
            const x=randInt(1,WORLD-2),y=randInt(1,WORLD-2);
            if(!occ.has(`${x},${y}`)){this.foods.push({x,y,spawnTime:this.time});return;}
            tries++;
        }
    }
    ensureFood(){while(this.foods.length<FOOD_MIN)this.spawnFood();}

    // ---- 开始游戏 ----
    startGame(){
        this.audio.init();this.audio.resume();
        this.state='PLAYING';
        this.score=0;this.combo=0;this.maxCombo=0;this.lastEatTime=0;
        this.foodEaten=0;this.kills=0;this.speed=BASE_SPEED;
        this.timeEnergy=ENERGY_MAX;this.isRewinding=false;
        this.stateHistory=[];this.tickAcc=0;this.interpFactor=0;
        this.particles.p=[];this.inputQueue=[];
        this.player=this.makeSnake(Math.floor(WORLD/2),Math.floor(WORLD/2),4,{x:1,y:0});
        this.visualDir={x:1,y:0};
        this.aiSnakes=[];this.aiRespawnTimers=[];
        const spawns=[{x:8,y:8,d:{x:1,y:0}},{x:WORLD-9,y:8,d:{x:-1,y:0}},{x:8,y:WORLD-9,d:{x:0,y:-1}}];
        for(let i=0;i<AI_COUNT;i++){
            this.aiSnakes.push(this.makeSnake(spawns[i].x,spawns[i].y,5,spawns[i].d,i));
            this.aiRespawnTimers.push(0);
        }
        this.foods=[];
        for(let i=0;i<FOOD_TARGET;i++)this.spawnFood();
        const h=this.player.body[0];
        this.camX=h.x;this.camY=h.y;this.camTargetX=h.x;this.camTargetY=h.y;
    }

    // ---- 时间倒流 ----
    saveState(){
        this.stateHistory.push({
            body:this.player.body.map(p=>({...p})),foods:this.foods.map(f=>({...f})),
            score:this.score,dir:{...this.player.dir},foodEaten:this.foodEaten,
            speed:this.speed,combo:this.combo
        });
        if(this.stateHistory.length>MAX_HISTORY)this.stateHistory.shift();
    }
    rewindTick(){
        if(!this.stateHistory.length){this.isRewinding=false;this.audio.stopRewind();return;}
        for(let i=0;i<2&&this.stateHistory.length;i++){
            const s=this.stateHistory.pop();
            this.player.body=s.body;this.player.prevBody=s.body.map(p=>({...p}));
            this.foods=s.foods;this.score=s.score;this.player.dir=s.dir;
            this.player.nextDir={...s.dir};this.visualDir={...s.dir};
            this.foodEaten=s.foodEaten;this.speed=s.speed;this.combo=s.combo;
        }
        this.timeEnergy-=REWIND_DRAIN;
        if(this.timeEnergy<=0){this.timeEnergy=0;this.isRewinding=false;this.audio.stopRewind();}
        const h=this.player.body[0],s=this.w2s(h.x,h.y);
        this.particles.add(new Particle(s.x+rand(-40,40),s.y+rand(-40,40),rand(-60,60),rand(20,60),C.rewindTint,rand(1,2.5),rand(.2,.5),'float'));
    }

    // ---- 碰撞辅助 ----
    isWall(x,y){return x<0||x>=WORLD||y<0||y>=WORLD;}
    allSnakes(){return[this.player,...this.aiSnakes.filter(a=>a.alive)];}

    // ---- 输入处理 ----
    queueDir(d){if(this.inputQueue.length<3)this.inputQueue.push(d);}
    processInput(){
        while(this.inputQueue.length){
            const d=this.inputQueue.shift();
            if(d.x!==-this.player.dir.x||d.y!==-this.player.dir.y){
                if(d.x!==this.player.dir.x||d.y!==this.player.dir.y){
                    this.player.nextDir={...d};break;
                }
            }
        }
    }

    initInput(){
        const self=this;
        window.addEventListener('keydown',e=>{
            self.audio.resume();
            if(self.state==='MENU'||self.state==='GAMEOVER'){
                if(e.code==='Space'||e.code==='Enter'){self.startGame();e.preventDefault();}return;
            }
            if(self.state==='PLAYING'){
                if(e.code==='Space'){
                    if(!self.isRewinding&&self.timeEnergy>5){self.isRewinding=true;self.audio.startRewind();}
                    e.preventDefault();return;
                }
                const dm={'ArrowUp':{x:0,y:-1},'KeyW':{x:0,y:-1},'ArrowDown':{x:0,y:1},'KeyS':{x:0,y:1},
                          'ArrowLeft':{x:-1,y:0},'KeyA':{x:-1,y:0},'ArrowRight':{x:1,y:0},'KeyD':{x:1,y:0}};
                if(dm[e.code]){self.queueDir(dm[e.code]);e.preventDefault();}
            }
        });
        window.addEventListener('keyup',e=>{
            if(e.code==='Space'&&self.isRewinding){self.isRewinding=false;self.audio.stopRewind();}
        });
        if(this.isTouch)this.initTouch();
        window.addEventListener('resize',()=>self.resize());
    }

    initTouch(){
        const self=this;
        this.getJoyParams=()=>{
            const cx=this.W/2,cy=this.gameBot+this.joyAreaH/2;
            const r=Math.min(this.W*.18,this.joyAreaH*.35);
            return {cx,cy,r,thumbR:r*.45};
        };
        this.getRewindBtnParams=()=>{
            const r=Math.min(this.W*.08,this.joyAreaH*.2);
            return {cx:this.W-r-20,cy:this.gameBot+this.joyAreaH/2,r};
        };
        this.cv.addEventListener('touchstart',e=>{
            e.preventDefault();self.audio.resume();
            for(const t of e.changedTouches){
                const tx=t.clientX,ty=t.clientY;
                if(self.state==='MENU'||self.state==='GAMEOVER'){self.startGame();return;}
                if(self.state!=='PLAYING')continue;
                const jp=self.getJoyParams();
                if(dist(tx,ty,jp.cx,jp.cy)<jp.r*1.8){
                    self.joyActive=true;self.joyTouchId=t.identifier;
                    self.updateJoyDir(tx,ty,jp);continue;
                }
                const rb=self.getRewindBtnParams();
                if(dist(tx,ty,rb.cx,rb.cy)<rb.r*1.5){
                    self.rewindTouchId=t.identifier;
                    if(!self.isRewinding&&self.timeEnergy>5){self.isRewinding=true;self.audio.startRewind();}
                    continue;
                }
            }
        },{passive:false});
        this.cv.addEventListener('touchmove',e=>{
            e.preventDefault();
            if(self.state!=='PLAYING')return;
            for(const t of e.changedTouches){
                if(t.identifier===self.joyTouchId){
                    self.updateJoyDir(t.clientX,t.clientY,self.getJoyParams());
                }
            }
        },{passive:false});
        const endTouch=e=>{
            for(const t of e.changedTouches){
                if(t.identifier===self.joyTouchId){self.joyActive=false;self.joyTouchId=null;}
                if(t.identifier===self.rewindTouchId){
                    self.rewindTouchId=null;
                    if(self.isRewinding){self.isRewinding=false;self.audio.stopRewind();}
                }
            }
        };
        this.cv.addEventListener('touchend',e=>{e.preventDefault();endTouch(e);},{passive:false});
        this.cv.addEventListener('touchcancel',e=>{e.preventDefault();endTouch(e);},{passive:false});
    }

    updateJoyDir(tx,ty,jp){
        let dx=tx-jp.cx,dy=ty-jp.cy;
        const d=Math.hypot(dx,dy),maxD=jp.r*.8;
        if(d>maxD){dx=dx/d*maxD;dy=dy/d*maxD;}
        this.joyX=dx;this.joyY=dy;
        const threshold=jp.r*.25;
        if(d>threshold){
            if(Math.abs(dx)>Math.abs(dy))this.queueDir(dx>0?{x:1,y:0}:{x:-1,y:0});
            else this.queueDir(dy>0?{x:0,y:1}:{x:0,y:-1});
        }
    }

    // ---- 玩家 tick ----
    playerTick(){
        const p=this.player;
        this.processInput();
        p.dir={...p.nextDir}; this.visualDir={...p.dir};
        this.saveState();
        p.prevBody=p.body.map(s=>({...s}));
        const head=p.body[0];
        const nh={x:head.x+p.dir.x,y:head.y+p.dir.y};
        if(this.isWall(nh.x,nh.y)){this.gameOver();return;}
        // 碰自身
        for(let i=0;i<p.body.length-1;i++){
            if(p.body[i].x===nh.x&&p.body[i].y===nh.y){this.gameOver();return;}
        }
        // 碰AI蛇身体
        for(const ai of this.aiSnakes){
            if(!ai.alive)continue;
            for(const seg of ai.body){
                if(seg.x===nh.x&&seg.y===nh.y){this.gameOver();return;}
            }
        }
        p.body.unshift(nh);
        const fi=this.foods.findIndex(f=>f.x===nh.x&&f.y===nh.y);
        if(fi>=0){this.foods.splice(fi,1);this.eatFood(nh);}
        else{if(p.growPending>0)p.growPending--;else p.body.pop();}
    }

    eatFood(pos){
        const now=Date.now();
        if(now-this.lastEatTime<COMBO_TIMEOUT)this.combo=Math.min(this.combo+1,5);
        else this.combo=0;
        this.lastEatTime=now;
        if(this.combo>this.maxCombo)this.maxCombo=this.combo;
        const pts=10*(this.combo+1);
        this.score+=pts;this.foodEaten++;
        const s=this.w2s(pos.x,pos.y);
        this.particles.burst(s.x,s.y,C.foodCore,20);
        this.particles.scorePopup(s.x,s.y-8,`+${pts}`,this.combo>0?C.comboGlow:C.foodGlow);
        this.audio.eat(1+this.combo*.1);
        if(this.combo>0)this.audio.combo(this.combo);
        this.shakeAmt=Math.min(2+this.combo,6);this.gridPulse=.3;
        this.player.growPending++;
        if(this.foodEaten%5===0)this.speed=Math.min(MAX_SPEED,this.speed+SPEED_INC);
        this.ensureFood();
    }

    // ---- AI tick ----
    aiTick(ai,idx){
        if(!ai.alive)return;
        ai.prevBody=ai.body.map(p=>({...p}));
        const head=ai.body[0];
        const nearF=this.nearestFood(head);
        if(!nearF)return;
        const dirs=[{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
        // 按离食物距离排序
        dirs.sort((a,b)=>{
            const da=Math.abs(head.x+a.x-nearF.x)+Math.abs(head.y+a.y-nearF.y);
            const db=Math.abs(head.x+b.x-nearF.x)+Math.abs(head.y+b.y-nearF.y);
            return da-db;
        });
        // 所有蛇的身体集合
        const bodies=new Set();
        for(const sn of this.allSnakes()){
            sn.body.forEach((p,si)=>{
                if(sn===ai&&si===sn.body.length-1)return;
                bodies.add(`${p.x},${p.y}`);
            });
        }
        let chosen=null;
        // 10%随机
        if(Math.random()<.1){
            const safe=dirs.filter(d=>{const nx=head.x+d.x,ny=head.y+d.y;
                return !this.isWall(nx,ny)&&!bodies.has(`${nx},${ny}`)&&!(d.x===-ai.dir.x&&d.y===-ai.dir.y);});
            if(safe.length)chosen=safe[randInt(0,safe.length-1)];
        }
        if(!chosen){
            for(const d of dirs){
                if(this.isWall(head.x+d.x,head.y+d.y))continue;
                if(bodies.has(`${head.x+d.x},${head.y+d.y}`))continue;
                if(d.x===-ai.dir.x&&d.y===-ai.dir.y)continue;
                chosen=d;break;
            }
        }
        // 万一只有掉头可选
        if(!chosen){
            for(const d of dirs){
                if(!this.isWall(head.x+d.x,head.y+d.y)&&!bodies.has(`${head.x+d.x},${head.y+d.y}`)){chosen=d;break;}
            }
        }
        if(!chosen)return;
        ai.dir=chosen;
        const nh={x:head.x+ai.dir.x,y:head.y+ai.dir.y};
        if(this.isWall(nh.x,nh.y)){this.aiDeath(ai,idx);return;}
        // 碰所有蛇
        const allBodies=new Set();
        for(const sn of this.allSnakes()){
            sn.body.forEach((p,si)=>{
                if(sn===ai&&si===sn.body.length-1)return;
                allBodies.add(`${p.x},${p.y}`);
            });
        }
        if(allBodies.has(`${nh.x},${nh.y}`)){this.aiDeath(ai,idx);return;}
        ai.body.unshift(nh);
        const fi=this.foods.findIndex(f=>f.x===nh.x&&f.y===nh.y);
        if(fi>=0){
            this.foods.splice(fi,1);ai.foodEaten++;
            const s=this.w2s(nh.x,nh.y);
            this.particles.burst(s.x,s.y,C.aiColors[idx].head,8);
            if(ai.foodEaten%3===0)ai.growPending++;
        } else {
            if(ai.growPending>0)ai.growPending--;else ai.body.pop();
        }
        if(ai.body.length>25)ai.body.pop();
    }

    nearestFood(pos){
        let best=null,bestD=Infinity;
        for(const f of this.foods){const d=Math.abs(f.x-pos.x)+Math.abs(f.y-pos.y);if(d<bestD){bestD=d;best=f;}}
        return best;
    }

    aiDeath(ai,idx){
        ai.alive=false;
        const s=this.w2s(ai.body[0].x,ai.body[0].y);
        this.particles.explosion(s.x,s.y,40);
        // 身体掉落食物
        for(const seg of ai.body){
            if(Math.random()<AI_DEATH_FOOD_RATE){
                if(!this.foods.some(f=>f.x===seg.x&&f.y===seg.y))
                    this.foods.push({x:seg.x,y:seg.y,spawnTime:this.time});
            }
        }
        this.audio.kill();this.kills++;
        this.score+=50;this.particles.scorePopup(s.x,s.y-15,'KILL +50',C.aiColors[idx].head);
        this.shakeAmt=8;this.gridPulse=.5;
        this.aiRespawnTimers[idx]=AI_RESPAWN_TIME;
    }

    aiRespawn(idx){
        const edges=[
            {x:randInt(2,WORLD-3),y:2},{x:randInt(2,WORLD-3),y:WORLD-3},
            {x:2,y:randInt(2,WORLD-3)},{x:WORLD-3,y:randInt(2,WORLD-3)}
        ];
        const bodies=new Set();
        for(const sn of this.allSnakes())sn.body.forEach(p=>bodies.add(`${p.x},${p.y}`));
        for(const ep of edges){
            if(!bodies.has(`${ep.x},${ep.y}`)){
                const d=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}][randInt(0,3)];
                this.aiSnakes[idx]=this.makeSnake(ep.x,ep.y,4,d,idx);
                this.aiRespawnTimers[idx]=0;return;
            }
        }
        this.aiRespawnTimers[idx]=3;
    }

    gameOver(){
        this.state='GAMEOVER';this.deathTime=this.time;
        this.audio.stopRewind();this.audio.death();
        const s=this.w2s(this.player.body[0].x,this.player.body[0].y);
        this.particles.explosion(s.x,s.y,80);this.shakeAmt=15;
        if(this.score>this.highScore){
            this.highScore=this.score;
            localStorage.setItem('neonSerpentHigh',this.highScore.toString());
        }
    }

    // ---- 更新循环 ----
    update(dt){
        this.time+=dt;
        if(this.state==='MENU'){this.updateMenu(dt);return;}
        if(this.state==='GAMEOVER'){this.particles.update(dt);this.shakeAmt*=.93;return;}
        if(this.isRewinding){this.rewindTick();}
        else{
            this.tickAcc+=dt;const interval=1/this.speed;
            let ticks=0;
            while(this.tickAcc>=interval&&ticks<3){
                this.tickAcc-=interval;ticks++;this.playerTick();
                if(this.state!=='PLAYING')return;
            }
            this.interpFactor=clamp(this.tickAcc/interval,0,1);
            // AI tick
            for(let i=0;i<this.aiSnakes.length;i++){
                const ai=this.aiSnakes[i];
                if(!ai.alive){this.aiRespawnTimers[i]-=dt;if(this.aiRespawnTimers[i]<=0)this.aiRespawn(i);continue;}
                const aiSpeed=this.speed*.85;
                ai.tickAcc+=dt;
                while(ai.tickAcc>=1/aiSpeed){ai.tickAcc-=1/aiSpeed;this.aiTick(ai,i);}
            }
            this.timeEnergy=Math.min(ENERGY_MAX,this.timeEnergy+ENERGY_REGEN);
            this.ensureFood();
        }
        // 摄像机跟随
        if(this.player?.alive){
            const h=this.player.body[0];
            this.camTargetX=h.x+this.player.dir.x*this.interpFactor;
            this.camTargetY=h.y+this.player.dir.y*this.interpFactor;
        }
        this.camX=lerp(this.camX,this.camTargetX,8*dt);
        this.camY=lerp(this.camY,this.camTargetY,8*dt);
        // 拖尾粒子
        if(this.player?.alive&&this.player.body.length>1&&Math.random()<.4){
            const tail=this.player.body[this.player.body.length-1];
            if(this.isVisible(tail.x,tail.y)){
                const s=this.w2s(tail.x,tail.y);
                this.particles.trail(s.x,s.y,lerpColor(C.bodyStart,C.bodyEnd,1));
            }
        }
        this.particles.update(dt);
        this.shakeAmt*=.9;if(this.shakeAmt<.1)this.shakeAmt=0;
        this.gridPulse*=.92;if(this.gridPulse<.01)this.gridPulse=0;
        this.shakeX=(Math.random()-.5)*this.shakeAmt*2;
        this.shakeY=(Math.random()-.5)*this.shakeAmt*2;
    }

    updateMenu(dt){
        this.menuAcc+=dt;this.menuTurnT-=dt;
        if(this.menuAcc<.08)return;this.menuAcc=0;
        if(this.menuTurnT<=0){this.menuTurnT=rand(.3,1.2);
            const ds=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>d.x!==-this.menuDir.x||d.y!==-this.menuDir.y);
            this.menuDir=ds[randInt(0,ds.length-1)];
        }
        const h=this.menuSnake[0];let nx=h.x+this.menuDir.x,ny=h.y+this.menuDir.y;
        if(nx<3||nx>=WORLD-3||ny<3||ny>=WORLD-3){
            const ds=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>d.x!==-this.menuDir.x||d.y!==-this.menuDir.y);
            this.menuDir=ds[randInt(0,ds.length-1)];nx=h.x+this.menuDir.x;ny=h.y+this.menuDir.y;
        }
        this.menuSnake.unshift({x:nx,y:ny});
        if(this.menuSnake.length>18)this.menuSnake.pop();
        this.particles.update(dt);
    }

    initMenuSnake(){
        this.menuSnake=[];
        const cx=Math.floor(WORLD/2),cy=Math.floor(WORLD/2);
        for(let i=0;i<12;i++)this.menuSnake.push({x:cx-i,y:cy});
    }

    // ---- 渲染 ----
    render(){
        const ctx=this.ctx,w=this.W,h=this.H;
        ctx.fillStyle=C.bg;ctx.fillRect(0,0,w,h);
        if(this.state==='MENU'){this.renderMenu(ctx,w,h);return;}
        ctx.save();
        ctx.beginPath();ctx.rect(0,this.gameTop,this.gameW,this.gameH);ctx.clip();
        ctx.translate(this.shakeX,this.shakeY);
        this.renderGrid(ctx);
        this.renderFoods(ctx);
        for(let i=0;i<this.aiSnakes.length;i++){if(this.aiSnakes[i].alive)this.renderSnake(ctx,this.aiSnakes[i],C.aiColors[i]);}
        if(this.player?.alive)this.renderSnake(ctx,this.player,null);
        this.particles.render(ctx);
        this.renderVignette(ctx,this.gameW,this.gameH,this.gameTop);
        ctx.restore();
        this.renderHUD(ctx,w);
        if(this.isTouch&&this.state==='PLAYING')this.renderJoystick(ctx);
        if(this.isRewinding)this.renderRewindFX(ctx,w,h);
        if(this.state==='GAMEOVER'&&this.time-this.deathTime<.3){
            ctx.fillStyle=`rgba(255,0,68,${(.3-(this.time-this.deathTime))/.3*.3})`;ctx.fillRect(0,0,w,h);
        }
        if(this.state==='PLAYING')this.renderMinimap(ctx);
        if(this.state==='GAMEOVER')this.renderGameOver(ctx,w,h);
    }

    renderGrid(ctx){
        const cs=this.cellSize;
        const startGX=Math.floor(this.camX-VIEW_CELLS/2)-1;
        const startGY=Math.floor(this.camY-VIEW_CELLS/2)-1;
        const endGX=startGX+VIEW_CELLS+3,endGY=startGY+VIEW_CELLS+3;
        for(let gx=startGX;gx<=endGX;gx++){
            for(let gy=startGY;gy<=endGY;gy++){
                if(gx<0||gx>=WORLD||gy<0||gy>=WORLD)continue;
                const s=this.w2s(gx,gy);
                ctx.fillStyle=(gx+gy)%2===0?'#08081a':'#0a0a1e';
                ctx.fillRect(s.x,s.y,cs,cs);
            }
        }
        // 边界
        const tl=this.w2s(0,0),br=this.w2s(WORLD,WORLD);
        const bAlpha=.4+this.gridPulse*.6;
        ctx.strokeStyle=hexRgba(C.headGlow,bAlpha);ctx.lineWidth=2;
        ctx.shadowColor=C.headGlow;ctx.shadowBlur=10+this.gridPulse*20;
        ctx.strokeRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);ctx.shadowBlur=0;
    }

    renderFoods(ctx){
        for(const f of this.foods){
            if(!this.isVisible(f.x,f.y))continue;
            const s=this.w2s(f.x,f.y),cs=this.cellSize;
            const pulse=1+Math.sin(this.time*4)*.12,r=cs*.32*pulse;
            ctx.save();ctx.globalCompositeOperation='lighter';
            ctx.shadowColor=C.foodGlow;ctx.shadowBlur=15;
            ctx.fillStyle=hexRgba(C.foodGlow,.12);ctx.beginPath();ctx.arc(s.x,s.y,r*2.2,0,Math.PI*2);ctx.fill();
            ctx.shadowBlur=8;ctx.fillStyle=hexRgba(C.foodCore,.5);ctx.beginPath();ctx.arc(s.x,s.y,r*1.2,0,Math.PI*2);ctx.fill();
            ctx.fillStyle=C.foodCore;ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fill();
            ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x-r*.2,s.y-r*.2,r*.25,0,Math.PI*2);ctx.fill();
            ctx.restore();
        }
    }

    renderSnake(ctx,snake,colorInfo){
        const cs=this.cellSize,isPlayer=!colorInfo;
        const headColor=isPlayer?C.headGlow:colorInfo.head;
        const bodyEnd=isPlayer?C.bodyEnd:colorInfo.bodyEnd;
        const len=snake.body.length;
        // 连接线
        ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineWidth=cs*.18;ctx.lineCap='round';
        for(let i=0;i<len-1;i++){
            const c=snake.body[i],n=snake.body[i+1];
            if(!this.isVisible(c.x,c.y)&&!this.isVisible(n.x,n.y))continue;
            const sc=this.w2s(c.x,c.y),sn=this.w2s(n.x,n.y);
            const ratio=i/Math.max(1,len-1);
            ctx.strokeStyle=hexRgba(lerpColor(headColor,bodyEnd,ratio),.4);
            ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=4;
            ctx.beginPath();ctx.moveTo(sc.x,sc.y);ctx.lineTo(sn.x,sn.y);ctx.stroke();
        }
        ctx.restore();
        // 身体段
        for(let i=len-1;i>=0;i--){
            const seg=snake.body[i];
            if(!this.isVisible(seg.x,seg.y))continue;
            const s=this.w2s(seg.x,seg.y);
            const ratio=i/Math.max(1,len-1);
            const segSize=cs*lerp(.38,.24,ratio);
            const color=lerpColor(headColor,bodyEnd,ratio);
            ctx.save();ctx.globalCompositeOperation='lighter';
            if(i===0){
                ctx.shadowColor=headColor;ctx.shadowBlur=16;
                ctx.fillStyle=hexRgba(headColor,.15);ctx.beginPath();ctx.arc(s.x,s.y,segSize*1.8,0,Math.PI*2);ctx.fill();
                ctx.shadowBlur=10;ctx.fillStyle=headColor;ctx.beginPath();ctx.arc(s.x,s.y,segSize,0,Math.PI*2);ctx.fill();
                ctx.shadowBlur=0;ctx.fillStyle=isPlayer?C.headCore:'#fff';ctx.beginPath();ctx.arc(s.x,s.y,segSize*.5,0,Math.PI*2);ctx.fill();
                const dir=isPlayer?this.visualDir:snake.dir;
                const eo=segSize*.3,er=segSize*.14,px=-dir.y,py=dir.x;
                ctx.fillStyle='#001122';
                ctx.beginPath();ctx.arc(s.x+dir.x*eo*.5+px*eo,s.y+dir.y*eo*.5+py*eo,er,0,Math.PI*2);ctx.fill();
                ctx.beginPath();ctx.arc(s.x+dir.x*eo*.5-px*eo,s.y+dir.y*eo*.5-py*eo,er,0,Math.PI*2);ctx.fill();
            } else {
                ctx.shadowColor=color;ctx.shadowBlur=6;
                ctx.fillStyle=hexRgba(color,.12);ctx.beginPath();ctx.arc(s.x,s.y,segSize*1.6,0,Math.PI*2);ctx.fill();
                ctx.fillStyle=color;ctx.beginPath();ctx.arc(s.x,s.y,segSize,0,Math.PI*2);ctx.fill();
                ctx.shadowBlur=0;ctx.fillStyle=hexRgba('#fff',.2);ctx.beginPath();ctx.arc(s.x,s.y,segSize*.3,0,Math.PI*2);ctx.fill();
            }
            ctx.restore();
        }
    }

    renderVignette(ctx,w,h,top){
        const cx=w/2,cy=top+h/2,r=Math.max(w,h)*.65;
        const g=ctx.createRadialGradient(cx,cy,r*.35,cx,cy,r);
        g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.45)');
        ctx.fillStyle=g;ctx.fillRect(0,top,w,h);
    }

    renderHUD(ctx,w){
        ctx.fillStyle='rgba(5,5,16,0.75)';ctx.fillRect(0,0,w,this.hudH);
        ctx.save();
        ctx.font='bold 22px "Courier New",monospace';ctx.fillStyle=C.scoreGlow;
        ctx.shadowColor=C.scoreGlow;ctx.shadowBlur=8;ctx.textAlign='left';
        ctx.fillText(`${this.score}`,20,35);
        ctx.font='10px "Courier New",monospace';ctx.fillStyle=hexRgba(C.scoreGlow,.5);ctx.shadowBlur=0;
        ctx.fillText('SCORE',20,14);
        ctx.textAlign='left';ctx.fillStyle=hexRgba('#ff4444',.8);ctx.fillText(`KILL ${this.kills}`,120,35);
        if(this.combo>0&&Date.now()-this.lastEatTime<COMBO_TIMEOUT+400){
            const cs=1+Math.sin(this.time*8)*.08;
            ctx.font=`bold ${Math.round(20*cs)}px "Courier New",monospace`;
            ctx.fillStyle=C.comboGlow;ctx.shadowColor=C.comboGlow;ctx.shadowBlur=10;
            ctx.textAlign='center';ctx.fillText(`${this.combo+1}x COMBO`,w/2,35);
        }
        const bw=Math.min(130,w*.25),bh=12,bx=w-bw-20,by=22;
        ctx.fillStyle=C.energyBg;ctx.fillRect(bx,by,bw,bh);
        const er=this.timeEnergy/ENERGY_MAX;
        const eg=ctx.createLinearGradient(bx,0,bx+bw*er,0);
        eg.addColorStop(0,C.energyBar);eg.addColorStop(1,'#ff44cc');
        ctx.fillStyle=eg;ctx.shadowColor=C.energyBar;ctx.shadowBlur=er>.3?4:1;
        ctx.fillRect(bx,by,bw*er,bh);ctx.shadowBlur=0;
        ctx.strokeStyle=hexRgba(C.energyBar,.4);ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
        ctx.font='9px "Courier New",monospace';ctx.fillStyle=hexRgba(C.energyBar,.6);ctx.textAlign='right';
        ctx.fillText('TIME ENERGY',bx+bw,by-3);
        ctx.font='10px "Courier New",monospace';ctx.fillStyle=hexRgba('#8888aa',.5);ctx.textAlign='left';
        if(this.player)ctx.fillText(`LEN ${this.player.body.length}  SPD ${this.speed.toFixed(1)}`,20,this.hudH-2);
        ctx.restore();
    }

    renderMinimap(ctx){
        const size=Math.min(90,this.W*.2);
        const mx=this.W-size-8,my=this.gameTop+8;
        const cs=size/WORLD;
        ctx.save();
        ctx.fillStyle='rgba(5,5,20,0.75)';ctx.fillRect(mx-2,my-2,size+4,size+4);
        ctx.strokeStyle=hexRgba(C.headGlow,.3);ctx.lineWidth=1;ctx.shadowColor=C.headGlow;ctx.shadowBlur=4;
        ctx.strokeRect(mx-2,my-2,size+4,size+4);ctx.shadowBlur=0;
        ctx.fillStyle=hexRgba(C.foodGlow,.5);
        for(const f of this.foods)ctx.fillRect(mx+f.x*cs,my+f.y*cs,Math.max(1.5,cs),Math.max(1.5,cs));
        for(let i=0;i<this.aiSnakes.length;i++){
            const ai=this.aiSnakes[i];if(!ai.alive)continue;
            ctx.fillStyle=hexRgba(C.aiColors[i].head,.6);
            for(const p of ai.body)ctx.fillRect(mx+p.x*cs,my+p.y*cs,Math.max(1.5,cs),Math.max(1.5,cs));
        }
        if(this.player?.alive){
            ctx.fillStyle=C.headGlow;ctx.shadowColor=C.headGlow;ctx.shadowBlur=3;
            for(const p of this.player.body)ctx.fillRect(mx+p.x*cs,my+p.y*cs,Math.max(2,cs),Math.max(2,cs));
            ctx.shadowBlur=0;
        }
        const vpW=(this.gameW/this.cellSize)*cs,vpH=(this.gameH/this.cellSize)*cs;
        ctx.strokeStyle=hexRgba('#fff',.2);ctx.lineWidth=1;
        ctx.strokeRect(mx+this.camX*cs-vpW/2,my+this.camY*cs-vpH/2,vpW,vpH);
        ctx.restore();
    }

    renderJoystick(ctx){
        const jp=this.getJoyParams(),rb=this.getRewindBtnParams();
        ctx.fillStyle='rgba(5,5,16,0.85)';ctx.fillRect(0,this.gameBot,this.W,this.joyAreaH);
        ctx.strokeStyle=hexRgba(C.headGlow,.15);ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(0,this.gameBot);ctx.lineTo(this.W,this.gameBot);ctx.stroke();
        ctx.save();ctx.globalAlpha=.5;
        ctx.beginPath();ctx.arc(jp.cx,jp.cy,jp.r,0,Math.PI*2);
        ctx.fillStyle=C.joyBase;ctx.fill();
        ctx.strokeStyle=C.joyBorder;ctx.lineWidth=2;ctx.stroke();ctx.restore();
        const tx=jp.cx+(this.joyActive?this.joyX:0),ty=jp.cy+(this.joyActive?this.joyY:0);
        ctx.save();ctx.globalCompositeOperation='lighter';
        ctx.shadowColor=C.joyThumb;ctx.shadowBlur=this.joyActive?12:6;
        ctx.fillStyle=hexRgba(C.joyThumb,this.joyActive?.7:.35);
        ctx.beginPath();ctx.arc(tx,ty,jp.thumbR,0,Math.PI*2);ctx.fill();ctx.restore();
        ctx.save();ctx.font='bold 10px monospace';ctx.fillStyle=hexRgba(C.joyThumb,.25);ctx.textAlign='center';
        ctx.fillText('W',jp.cx,jp.cy-jp.r+12);ctx.fillText('S',jp.cx,jp.cy+jp.r-5);
        ctx.fillText('A',jp.cx-jp.r+10,jp.cy+4);ctx.fillText('D',jp.cx+jp.r-10,jp.cy+4);
        ctx.restore();
        // 倒流按钮
        ctx.save();
        ctx.beginPath();ctx.arc(rb.cx,rb.cy,rb.r,0,Math.PI*2);
        ctx.fillStyle=hexRgba(C.rewindBtn,this.isRewinding?.4:.15);ctx.fill();
        ctx.strokeStyle=hexRgba(C.rewindBtn,.5);ctx.lineWidth=2;ctx.stroke();
        ctx.shadowColor=C.rewindBtn;ctx.shadowBlur=this.isRewinding?10:4;
        ctx.font=`bold ${Math.round(rb.r*.6)}px monospace`;ctx.fillStyle=hexRgba(C.rewindBtn,.8);
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⏪',rb.cx,rb.cy);
        ctx.restore();
    }

    renderRewindFX(ctx,w,h){
        ctx.fillStyle='rgba(255,120,0,0.06)';ctx.fillRect(0,0,w,h);
        ctx.save();ctx.globalAlpha=.04;
        for(let y=0;y<h;y+=3)if(Math.random()<.5){ctx.fillStyle=C.rewindTint;ctx.fillRect(0,y,w,1);}
        ctx.globalAlpha=.1;for(let i=0;i<2;i++){ctx.fillStyle=C.rewindTint;ctx.fillRect(0,rand(0,h),w,rand(1,2));}
        ctx.restore();
        const ra=.4+Math.sin(this.time*6)*.25;
        ctx.save();ctx.globalAlpha=ra;ctx.font='bold 14px monospace';ctx.fillStyle=C.rewindTint;
        ctx.shadowColor=C.rewindTint;ctx.shadowBlur=8;ctx.textAlign='center';
        ctx.fillText('◄◄ REWIND ◄◄',w/2,this.gameTop+25);ctx.restore();
    }

    renderMenu(ctx,w,h){
        const cs=this.cellSize;
        for(let i=this.menuSnake.length-1;i>=0;i--){
            const seg=this.menuSnake[i],s=this.w2s(seg.x,seg.y);
            const ratio=i/Math.max(1,this.menuSnake.length-1);
            ctx.save();ctx.globalAlpha=lerp(.35,.1,ratio);
            ctx.globalCompositeOperation='lighter';ctx.shadowColor=C.headGlow;ctx.shadowBlur=8;
            ctx.fillStyle=lerpColor(C.headGlow,C.bodyEnd,ratio);
            ctx.beginPath();ctx.arc(s.x,s.y,cs*lerp(.3,.18,ratio),0,Math.PI*2);ctx.fill();ctx.restore();
        }
        this.particles.render(ctx);
        const ty=h*.26,tp=1+Math.sin(this.time*2)*.02;
        ctx.save();ctx.textAlign='center';ctx.globalCompositeOperation='lighter';
        ctx.font=`bold ${Math.round(52*tp)}px "Courier New",monospace`;
        ctx.shadowColor=C.headGlow;ctx.shadowBlur=30;
        ctx.fillStyle=hexRgba(C.headGlow,.12);ctx.fillText('NEON',w/2,ty);
        ctx.fillStyle=C.headGlow;ctx.shadowBlur=12;ctx.fillText('NEON',w/2,ty);
        ctx.fillStyle=C.foodGlow;ctx.fillText('SERPENT',w/2,ty+50);
        ctx.shadowBlur=4;ctx.font='16px "Courier New",monospace';
        ctx.fillStyle=hexRgba(C.comboGlow,.7);ctx.shadowColor=C.comboGlow;
        ctx.fillText('时 间 在 你 手 中',w/2,ty+88);ctx.restore();
        const infoY=h*.56;
        ctx.save();ctx.textAlign='center';ctx.font='13px "Courier New",monospace';
        ctx.fillStyle=hexRgba('#8888cc',.7);
        ctx.fillText('50x50 开放地图  ·  3个AI对手  ·  抢食大战',w/2,infoY);
        ctx.fillText('方向键/WASD — 转向  |  SPACE — 时间倒流',w/2,infoY+22);
        if(this.isTouch)ctx.fillText('摇杆 — 转向  |  ⏪按钮 — 时间倒流',w/2,infoY+44);
        ctx.restore();
        const legY=infoY+(this.isTouch?70:50);
        ctx.save();ctx.font='12px "Courier New",monospace';ctx.textAlign='center';
        ctx.fillStyle=C.headGlow;ctx.fillText('● 玩家',w/2-80,legY);
        ctx.fillStyle=C.aiColors[0].head;ctx.fillText('● '+C.aiColors[0].name,w/2,legY);
        ctx.fillStyle=C.aiColors[1].head;ctx.fillText('● '+C.aiColors[1].name,w/2+90,legY);
        ctx.restore();
        const sa=.4+Math.sin(this.time*3)*.4;
        ctx.save();ctx.globalAlpha=sa;ctx.textAlign='center';
        ctx.font='bold 18px "Courier New",monospace';ctx.fillStyle=C.headCore;
        ctx.shadowColor=C.headGlow;ctx.shadowBlur=12;
        ctx.fillText(this.isTouch?'点击屏幕开始':'按 SPACE 或 点击屏幕 开始',w/2,h*.78);
        ctx.restore();
        if(this.highScore>0){
            ctx.save();ctx.textAlign='center';ctx.font='12px "Courier New",monospace';
            ctx.fillStyle=hexRgba(C.foodGlow,.6);ctx.fillText(`BEST: ${this.highScore}`,w/2,h*.84);ctx.restore();
        }
    }

    renderGameOver(ctx,w,h){
        ctx.fillStyle='rgba(5,5,16,0.7)';ctx.fillRect(0,0,w,h);
        const cy=h*.32;
        ctx.save();ctx.textAlign='center';
        ctx.font='bold 40px "Courier New",monospace';ctx.fillStyle=C.deathFlash;
        ctx.shadowColor=C.deathFlash;ctx.shadowBlur=18;
        ctx.fillText('VOID COLLAPSE',w/2,cy);
        ctx.shadowBlur=6;ctx.shadowColor=C.scoreGlow;
        ctx.font='bold 32px "Courier New",monospace';ctx.fillStyle=C.scoreGlow;
        ctx.fillText(`${this.score}`,w/2,cy+55);
        ctx.font='12px "Courier New",monospace';ctx.fillStyle=hexRgba(C.scoreGlow,.5);ctx.shadowBlur=0;
        ctx.fillText('SCORE',w/2,cy+70);
        ctx.font='13px "Courier New",monospace';ctx.fillStyle=hexRgba('#8888cc',.7);
        ctx.fillText(`长度 ${this.player?this.player.body.length:0}  |  击杀 ${this.kills}  |  最高连击 ${this.maxCombo+1}x`,w/2,cy+100);
        if(this.score>=this.highScore&&this.score>0){
            ctx.font='bold 15px "Courier New",monospace';ctx.fillStyle=C.foodCore;
            ctx.shadowColor=C.foodGlow;ctx.shadowBlur=8;ctx.fillText('★ NEW BEST ★',w/2,cy+130);
        } else {
            ctx.font='12px "Courier New",monospace';ctx.fillStyle=hexRgba(C.foodGlow,.5);ctx.shadowBlur=0;
            ctx.fillText(`BEST: ${this.highScore}`,w/2,cy+130);
        }
        const ra=.4+Math.sin(this.time*3)*.35;
        ctx.globalAlpha=ra;ctx.font='bold 16px "Courier New",monospace';ctx.fillStyle=C.headCore;
        ctx.shadowColor=C.headGlow;ctx.shadowBlur=8;
        ctx.fillText(this.isTouch?'点击屏幕重新开始':'按 SPACE 重新开始',w/2,cy+175);
        ctx.restore();
    }

    run(){
        const loop=ts=>{
            if(!this.lastTime)this.lastTime=ts;
            const dt=Math.min((ts-this.lastTime)/1000,.04);
            this.lastTime=ts;this.update(dt);this.render();
            requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
    }
}

// ==================== 启动 ====================
new Game(document.getElementById('c')).run();
</script>
</body>
</html>
